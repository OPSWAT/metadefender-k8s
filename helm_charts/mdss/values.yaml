# =============================================================================
# Image versions (used as image tags for each component)
# As of 4.4.0 the single BRANCH tag has been replaced by per-source versions:
#   mdss_version           applies to images built from md-storage-security
#   mdplatform_version     applies to images built from md-platform
#   <integration>_version  applies to images built from md-integrations
# Each entry in mdss_components may override these via its own `tag:` field.
# When `tag:` is not set on a component, mdss_version is used as the default.
# =============================================================================
mdss_version: "4.6.1"
mdplatform_version: "2.7.1"

# Image tags for the two integrations that still ship a workload of their own.
# Every other vendor is an in-process provider: the orchestrators compile the provider
# assemblies in, and the scanning service loads them from the providers directory the
# MDSS-flavoured scanning image bakes in. They have no image, no version and no workload.
nfs_version: "2.4.1"
smb_version: "2.4.1"

# Generate secrets for MDSS database username, password, postgres user and password
mdss_generate_secrets: true
MDSS_DB_USER: mdss                  # PostgreSQL database username 
MDSS_DB_PASSWORD: null              # PostgreSQL database password, if not set it will be randomly generated
MDSS_DB_HOST: postgres-mdss       # Hostname / entrypoint of the database, this value should be changed any if using an external database service
MDSS_DB_PORT: "5432"              # Port for the PostgreSQL Database
MDSS_DB_NAME: MDSS                # Database name to use

# Connection string template for the PostgreSQL database, additional db options can be added
POSTGRESQL_URL: "Host=<MDSS_DB_HOST>;Port=<MDSS_DB_PORT>;Username=<MDSS_DB_USER>;Password=<MDSS_DB_PASSWORD>;Database=<MDSS_DB_NAME>;Timeout=60;CommandTimeout=60"

# Default values for mdss. These will also be included in the environment of each mdss container
mdss-common-environment:

  # Storage types available in the product. Every vendor runs inside the MDSS services; nfs and smb
  # are the only entries that deploy an extra pod (nfsservice, smbservice).
  ENABLED_MODULES: "azureblob,amazonsdk,nfs"
  # All supported modules:
  # ENABLED_MODULES: "azureblob,amazonsdk,googlecloud,alibabacloud,azurefiles,smb,box,graph,sftp,nfs,mft,ftp,oraclesdk"

  # PostgreSQL migrations Configuration
  PGMIGRATIONS_PORT: "27777"
  PGMIGRATIONS_HOST: "pgmigrations"
  PGMIGRATIONS_SCRIPTS_PATH: "/pgmigrations/ef_migrations"
  PGMIGRATIONS_SCRIPTS_PATH_400: "/pgmigrations/ef_migrations_400"

  # Skip MongoDB to PostgreSQL migration by default
  SKIP_MONGO_TO_PG: "yes"
  
  # [DEPRECATED] Uncomment only when migrating data from MongoDB
  # This defines the connection string to the db ( should be modified when using an external db)
  MONGO_URL: "mongodb://mongodb:27017/MDCS"

  # Some managed mongo db services require ignoring certificate errors 
  MONGO_SSL_ALLOW_INVALID_CERTIFICATES: "false"

  MONGO_CA_CERTIFICATE: ""
  MONGO_DB: "MDCS"
  MONGO_MIGRATIONS_HOST: "mongomigrations"
  MONGO_MIGRATIONS_PORT: "27778"

  RABBITMQ_URI: "amqp://rabbitmq:5672"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_PASS: "guest"
  RABBITMQ_DEFAULT_USER: "guest"
  # RABBITMQ_RPC_LONG_TIMEOUT value is in minutes
  RABBITMQ_RPC_LONG_TIMEOUT: "5"
  # This can be modified in order to define how many messages can be sent to rabbitmq in parallel.
  RABBITMQ_SCANNING_PREFETCH_COUNT: "10"

  # APIGATEWAY_HOST is NOT set here. It is derived in config-template.yml from
  # mdss_components.apigateway.name, which also names the Service and selector,
  # so the hostname has one definition. Adding it here would duplicate the key.
  #
  # There is deliberately no MDSS_RESOLVER: the webclient image reads the
  # resolver from /etc/resolv.conf when that variable is unset, which in a pod
  # is already the cluster DNS.
  #
  # Single source of truth for the gateway's ports. Everything that needs to
  # agree about them is rendered from these two: the Service ports and the
  # containerPort (services-template.yml / deployments-template.yml), the
  # gateway's own Kestrel binding via ASPNETCORE_URLS, and the webclient's
  # nginx upstream and readiness wait, which read them from this ConfigMap.
  #
  # They were "8005"/"8006", carried over from docker-compose, while the
  # Service published 80/443 -- so anything building APIGATEWAY_HOST:
  # APIGATEWAY_PORT pointed at a port nothing answered on.
  #
  # APIGATEWAY_PORT is not inert: the gateway reads it directly
  # (Backend/src/Gateway/opswat.mdcs.api.gateway/RegisterServiceDependencies.cs)
  # as Kestrel's listen port whenever ASPNETCORE_URLS is unset, defaulting to
  # 8005 in code and binding loopback only. Setting ASPNETCORE_URLS from this
  # value keeps that fallback consistent instead of merely unreachable.
  APIGATEWAY_PORT: "80"
  APIGATEWAY_PORT_SSL: "443"
  APIGATEWAY_WEBCLIENT_PATH_IN_CONTAINER: "/app/webclient"
  APIGATEWAY_CUSTOMER_ENV_PATH_IN_CONTAINER: "/app/customer.env"

  NGINX_TIMEOUT: "300"
  BACKUPS_TO_KEEP: "3"
  LICENSINGSERVICE_HOST: "licensingservice"
  LICENSINGSERVICE_URL: "http://licensingservice"
  LICENSINGSERVICE_PORT: "5000"
  LICENSINGSERVICE_LISTENING_IP: "0.0.0.0"
  PRODUCT_NAME: "MetaDefender Storage Security"
  PRODUCT_NAME_SHORT: "MDSS"
  SMBSERVICE_URL: "http://smbservice"
  NFSSERVICE_URL: "http://nfsservice"
  # by default we use 6002-6006 7002-7006 because we start 5 processes internally
  SMBSERVICE_PORT: "6002"
  SMBSERVICE_LISTENING_IP: "0.0.0.0"
  NFSSERVICE_PORT: "5004"
  NFSSERVICE_LISTENING_IP: "0.0.0.0"
  ALLOW_SSL_CONFIGURATION_FROM_UI: "False"

  IDENTITY_SERVICE_URL: "http://identityservice"
  IDENTITY_SERVICE_PORT: "7001"
  
  # These variables can be changed to reveal debug information in the application
  LOG_LEVEL: "4"
  SERILOG_BATCH_POSTING_LIMIT: "100"

  # in seconds
  SMB_SHORT_DEADLINE: "30"
  # in minutes
  SMB_LONG_DEADLINE: "15"

  # in seconds
  SFTP_SHORT_DEADLINE: "30"
  # in minutes
  SFTP_LONG_DEADLINE: "15"

  # in seconds
  NFS_SHORT_DEADLINE: "30"
  # in minutes
  NFS_LONG_DEADLINE: "15"

  # This can be modified in order to specify the number of retries per operation( e.g: download, upload, scan)
  POLLY_RETRY_COUNT: "3"
  # There are two types of retry long and short. Long retry is configured to try every 1 minute until the POLLY_RETRY_COUNT is reached. This retry is used for web requests.
  POLLY_LONG_RETRY: "1"
  # This is the short retry version, configured to retry after 1 second.
  POLLY_SHORT_RETRY: "1"

  # Graph API retry policy: max retries with exponential backoff (overrides POLLY_RETRY_COUNT for Graph calls)
  GRAPH_MAX_RETRIES: "5"
  # Base delay in seconds for exponential backoff (delay = base^attempt + jitter)
  GRAPH_RETRY_BASE_DELAY_SECONDS: "2"

  # Retry attempts for a failed OCM config-slot push before deferring to the next scheduled sync cycle.
  OCM_CONFIG_PUSH_RETRY_COUNT: "3"
  # Base delay (ms) for the jittered exponential back-off between OCM config-slot push retries.
  OCM_CONFIG_PUSH_RETRY_BASE_DELAY_MS: "1000"

  # This value is used to define the upload chuck for files transferred using SMB/SFTP/NFS , the limit is 7 MB (for azure files the limit is 4MB)
  SMB_UPLOAD_CHUNK: "2"
  SFTP_UPLOAD_CHUNK: "2"
  NFS_UPLOAD_CHUNK: "2"

  # This value is used to determine how MDSS consider that a file from a smb share is ready to be processed (Default 1-FILEOPEN_CHECK, 0-DEBOUNCE_CHECK)
  SMBSERVICE_FILE_READY_CHECK_MODE: "1"
  # This can be modified in order to define how many threads can be processed in parallel.
  SMBSERVICE_PREFETCH_COUNT: "60"

  # This can be changed to the following values 0 - Default, 1 - IgnoreChainErrors, 2 - IgnoreAllErrors
  MD_CORE_CERTIFICATE_VALIDATION: "0"

  # Box request retries and the base delay (seconds) of their exponential backoff
  BOX_MAX_RETRIES: "5"
  BOX_RETRY_BASE_DELAY_SECONDS: "1"
  # This defines how much time shall pass between remediation retries when encountering failures.
  POLLY_POST_ACTION_RETRY_TIME: "30"

  LOAD_BALANCER_MD_CORE_UNAVAILABLE_TIME: "5"
  WEBCLIENT_HOST: "webclient"

  # This variable is used in order to limit the number of blobs we receive from azure per response.
  AZURE_BLOBS_PAGE_SIZE: "100"

  # This variable is used to force Signature Version 4 for AWS S3/S3 compatible request. 
  FORCE_AWS_SIGNATURE_V4: "1"

  DISCOVERY_SERVICE_IGNORE_EMPTY_OBJECTS: "0"

  # This variable is used to ignore nfs hidden objects (0 - do not ignore, 1 - ignore)
  DISCOVERY_SERVICE_NFS_SKIP_HIDDEN_OBJECTS: "0"

  # This variable is used to define how much time should pass until we can discover a file that has failed previously, after 24 hours it shall be discovered again.
  DISCOVERY_SERVICE_REPROCESSING_FAILED_TIME_HOURS: "24"

  # This variable is used to define how much time should pass until a stuck file's state is set to failed
  MARK_STUCK_FILE_AS_FAILED_HOURS: "24"

  CACHE_SERVICE_URI: "redis:6379,syncTimeout=10000"
  ### Deprecated
  CACHE_SERVICE_URL: "redis"
  CACHE_SERVICE_PORT: "6379"
  ###

  # This retry time is used for other generic operations.
  POLLY_RETRY_TIME: "30"

  # in seconds
  OBJECT_CONTENT_REDIS_TTL: "30"

  # Default number of hours for token expiration, maximum 24 hours
  TOKEN_EXPIRY_TIME_HOURS: "1"

  # time to wait (in minutes) before retrying the register session method in SMB
  SMBSERVICE_SESSION_RETRY_WAIT_TIME: "5"

  # maximum amount of retries for the register session method in SMB
  SMBSERVICE_SESSION_MAX_RETRIES: "3"

  # number of active connections per smb storage; default is 10, maximum is 100
  SMBSERVICE_SESSIONS_ON_STORAGE: "10"

  # time interval between two consecutive job runs for the discovery completed job
  DISCOVERY_COMPLETED_CHECK_SECONDS: "10"
  
  # number of retries of a file scan
  SCANNING_RETRY_COUNT: "3"
  
  # time interval (in seconds) windows service is checking if mdss processes are running
  PROCESSES_POLLING_INTERVAL: "10"
  
  # discovery throttler to stop creating discovery events
  DISCOVERY_THROTTLER_MAX_PENDING_FILES: "5000"
  DISCOVERY_THROTTLER_DELAY_MILLISECONDS: "60000"
  DISCOVERY_THROTTLER_MAX_DELAY_MINUTES: "10"
  DISCOVERY_THROTTLER_MAX_RETRY_ATTEMPTS: "10"
  DISCOVERY_THROTTLER_NOT_SCANNED_MAX_PENDING_FILES: "50000"
  DISCOVERY_THROTTLER_REMEDIATION_COMPLETED_MAX_PENDING_FILES: "50000"
  THROTTLE_QUEUE_INTERROGATION_INTERVAL_SECONDS: "30"
  
  # Scanning variables that adjust the load of each scan instance
  SCAN_INSTANCE_QUEUE_THRESHOLD: "400"
  READYZ_CACHE_JOB_SECONDS: "5"
  REQUEUE_RETRY_COUNT: "6"
  REQUEUE_TIME_PER_RETRY_SECONDS: "5"

  # Remediation Prefetch Count
  RABBITMQ_ALIBABACLOUD_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_AMAZONSDK_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_AZUREBLOB_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_AZUREFILES_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_BOX_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_GOOGLECLOUD_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_MFT_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_NFS_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_ONE_DRIVE_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_SFTP_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_SMB_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_FTP_REMEDIATIONS_PREFETCH_COUNT: "10"
  RABBITMQ_ORACLESDK_REMEDIATIONS_PREFETCH_COUNT: "10"

  # NFS Discovery Service: special handling for situations where copying a file takes a lot of time and the stream is constantly closed and opened again by Windows
  # By default, Windows puts zero bytes for the whole file when the copy operation starts
  # During copy operation, the stream is closed and open again multiple times, causing our product to detect the file as new file after each closing of the stream.
  # If enabled, will check the last X KB (end of file threshold) of the file to have one valid byte (different than 0). If found, file is discovered. If not found, file is skipped as is still uploading.
  DISCOVERY_SERVICE_NFS_LARGE_FILE_SPECIAL_HANDLING_ENABLED: "0"
  DISCOVERY_SERVICE_NFS_LARGE_FILE_SPECIAL_HANDLING_END_OF_FILE_THRESHOLD_KB: "512"
  DISCOVERY_SERVICE_NFS_LARGE_FILE_SPECIAL_HANDLING_MIN_FILE_SIZE_MB: "10"

  # If enabled, each SMB process will log, every 5 seconds, the number of open file handlers
  SMBSERVICE_LOG_OPEN_FILE_HANDLERS: "0"

  # Debounce interval between consecutive discoveries of the same file
  # Value represents how much time should pass before a file is considered a new file after being edited
  # Default value is 0, meaning that the file is considered a new file after each edit
  FILE_DISCOVERY_DEBOUNCE_INTERVAL: "0"

  # Discovery storage specific debounce time used in order to check if a file is uploaded or not, we check if the file has not been modified between a 5 seconds interval
  # They must be lower than the FILE_DISCOVERY_DEBOUNCE_INTERVAL. If FILE_DISCOVERY_DEBOUNCE_INTERVAL is 0, these values will be used
  SFTP_DISCOVERY_DEBOUNCE_TIME_SECONDS: "5"
  NFS_DISCOVERY_DEBOUNCE_TIME_SECONDS: "5"
  SMBSERVICE_DISCOVERY_DEBOUNCE_TIME: "5"

  # Maximum number of files when creating a Pdf From Report
  MAXIMUM_FILES_PDF_REPORT: "10000"
  # If set to 1, it will log the temporary created files during remediations operations
  LOG_CREATION_OF_TEMP_FILES: "0"
  
  SHAREPOINT_MAX_CONCURRENT_REQUESTS: "5"
  SHAREPOINT_BATCH_INTERVAL_MS: "10000"
  SHAREPOINT_BATCH_SIZE: "10"

  # Maximum time needed to download a single chunk of data
  NFS_DOWNLOAD_CHUNK_TIMEOUT_SECONDS: "60"

  # When set to true, allows deletion of the original object after a move remediation action even if some actions failed, 
  # as long as at least one action succeeded and no actions are pending
  DELETE_OBJECT_ON_MOVE_REMEDIATION_FAILURE: "false"
  # When set to 1 and the workflow has replace original object enabled, it will delete all the file versions after upload and leave only the sanitized version
  DELETE_FILE_VERSIONS_AFTER_REPLACE: "0"
  # time interval between the rtp polling intervals
  RTP_POLLING_INTERVAL_SECONDS: "5"

  # Stuck-state timeouts: how long a file may stay in remediation / idle scan before being marked as failed
  REMEDIATION_STUCK_TIMEOUT_HOURS: "1"
  SCAN_STUCK_WHILE_IDLE_TIMEOUT_HOURS: "1"

  # gRPC timeouts (inter-service calls between scanning / discovery / remediations)
  GRPC_BATCH_TIMEOUT_MINUTES: "30"
  GRPC_CLIENT_POOLED_CONNECTION_LIFETIME_MINUTES: "5"

  # This variable controls whether the gRPC channel should route connections through the system proxy (HTTP_PROXY/HTTPS_PROXY).
  GRPC_CHANNEL_USE_PROXY: "false"

  # If "true", scan results for archive entries are persisted in the database; otherwise only the parent file's
  # result is stored. Disabled by default to keep DB size manageable on large archive scans.
  STORE_ARCHIVE_SCAN_RESULTS: "false"

  # Kill switch: set to true to skip the scan-overlap check and allow scans that overlap an
  # already-running scan (restores pre-overlap-feature behaviour). Default false (check enabled).
  SKIP_SCAN_OVERLAP_CHECK: "false"

  SCANNING_AUTOSCALER_ENABLED: "true"

  # Show the Usage tab on the Dashboard
  USAGE_DASHBOARD_ENABLED: "true"

  # Data Retention Job Run Intervals

  # How often (in hours) the audit-log retention job runs. Must be > 0.
  AUDIT_LOGS_RETENTION_JOB_INTERVAL_HOURS: "1"
  # How often (in hours) the reports retention job runs. Must be > 0.
  REPORTS_RETENTION_JOB_INTERVAL_HOURS: "1"
  # How often (in hours) the RTP history retention job runs. Must be > 0.
  RTP_HISTORY_RETENTION_JOB_INTERVAL_HOURS: "1"

  # Disk/DB capacity guardrails

  # How often (in seconds) disk/DB capacity is assessed by the guardrail controller. Minimum 10.
  GUARDRAILS_CHECK_INTERVAL_SECONDS: "30"
  # Shared capacity ceiling for BOTH the machine-disk and database-size signals (used %):
  # pause processing when used >= the critical percent; resume when used <= the resume percent (hysteresis).
  GUARDRAILS_USED_CRITICAL_PERCENT: "90"
  GUARDRAILS_USED_RESUME_PERCENT: "80"
  # Path whose disk free space is monitored. Set explicitly when PostgreSQL lives on a separate volume.
  # GUARDRAILS_DISK_MONITOR_PATH: "/var/log/mdss"
  # Known PostgreSQL disk size in bytes (0 = the database-size signal is disabled). Set this when PG is on a separate/remote disk so DB growth is guarded against a configured ceiling.
  GUARDRAILS_PG_DISK_SIZE_BYTES: "0"
  # How often (in seconds) the retention-runway and Redis checks run. Minimum 60.
  GUARDRAILS_CONSISTENCY_INTERVAL_SECONDS: "300"
  # How often (in seconds) the Redis orphaned-key cleanup + memory-config reporting runs. Minimum 60.
  GUARDRAILS_REDIS_CHECK_INTERVAL_SECONDS: "600"
  # Upper bound on discovery cache keys inspected per orphaned-key scan
  GUARDRAILS_REDIS_ORPHAN_SCAN_LIMIT: "5000"
  # Dedicated guardrail PostgreSQL connection pool (kept off the service's main pools)
  # GUARDRAILS_DB_MIN_POOL_SIZE: "1"
  # GUARDRAILS_DB_MAX_POOL_SIZE: "3"

  # A scan engine reporting free disk <= this percent is treated as unhealthy and skipped by the load balancer
  SCAN_INSTANCE_DISK_CRITICAL_THRESHOLD_PERCENT: "5"
  # How often (in seconds) the scanning service runs the scan-instance health job (caches MDCore health + marks low-disk engines unavailable)
  SCAN_INSTANCE_HEALTH_JOB_INTERVAL_SECONDS: "30"

  # OPSWAT Telemetry Configuration
  ENABLE_TELEMETRY: "no"
  ENABLE_AUTO_INSTRUMENTATION: "no"
  ENABLE_CONSOLE_DEBUG: "no"
  OPTEL_METER_NAME: ""
  OPTEL_ACTIVITY_SOURCENAME: ""
  OPTEL_COLLECTOR_ENDPOINT: "https://activation.dl.opswat.com"
  OPTEL_COLLECTOR_TENANT: "mdss"

  # Proxy Configuration
  # Uncomment and set the following variables to configure proxy settings for all services.
  # HTTP_PROXY: "http://proxy_ip:proxy_port"
  # HTTPS_PROXY: "https://proxy_ip:proxy_port"
  # NO_PROXY: "apigateway,core,discoveryservice,jobdispatcher,licensingservice,loadbalancerservice,loggingservice,mongodb,mongomigrations,node,notificationservice,pgmigrations,postgres,rabbitmq,redis,remediationsservice,scanningservice,smbservice,storagesservice,identityservice,webclient,workflowmanagerservice,nfsservice"

# Set to true if the respective database engine should also be deployed
deploy_with_mdss_db: true                 # Enable or disable the local in-cluster database, set to false when deploying with an external database service

# Set to false to not create any volumes or host paths in the deployment, all storage will be ephemeral
persistance_enabled: true

# Set to true to deploy with HorizontalPodAutoscaling
#
# The values below are the defaults for every component. A component can override any of
# them with its own `hpa:` block under mdss_components, and opts out with `hpa.enabled: false`
# (set below for the databases, RabbitMQ, Redis and the migration pods: they are single
# instance by design and must never be scaled out).
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  cpuTargetUtilization: 85
  # Optional memory target (percent of the memory request); leave null to scale on CPU only
  memoryTargetUtilization: null
  # Optional autoscaling/v2 behavior block (scaleUp / scaleDown policies), passed through as-is
  behavior: {}

# Queue based autoscaling through KEDA (https://keda.sh), which must already be installed in
# the cluster (on OpenShift: the "Custom Metrics Autoscaler" operator). CPU is a poor signal
# for MDSS: a service waiting on MetaDefender Core or on a storage can have thousands of
# objects queued while using almost no CPU. KEDA reads the number of ready messages of the
# queues each component consumes and scales it on that backlog instead.
#
# When enabled, a ScaledObject is created for every component that lists `keda.queues`, and
# the CPU HPA above is skipped for that component (KEDA manages its own HPA, and two HPAs on
# one Deployment fight each other). The values below are the defaults; each component can
# override them in its own `keda:` block.
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 5
  # Target number of ready (not yet delivered) messages per replica, per queue
  queueLength: 100
  # Seconds to wait after the queues were last non-empty before scaling back to minReplicaCount
  cooldownPeriod: 300
  # Optional autoscaling/v2 behavior block for the HPA KEDA creates
  behavior: {}
  # KEDA connects to RabbitMQ over AMQP (port 5672), so no management plugin is needed.
  # By default the connection string is built from RABBITMQ_HOST, RABBITMQ_PORT,
  # RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS in mdss-common-environment and stored in
  # the Secret below. To use an existing Secret instead, set existingSecret to its name; it
  # must hold the full amqp:// URI under the key `host`.
  existingSecret: null
  secretName: mdss-keda-rabbitmq

# Default rollout strategy for every Deployment. A component can override it with its own
# `strategy:` block (the databases, RabbitMQ, Redis and the migration pods use maxSurge 0:
# two copies of them must never run at once, and the databases would share one volume).
# maxSurge 1 / maxUnavailable 0 starts the new pod and waits for it before stopping an old
# one, so restarts and configuration changes do not interrupt a service.
# Note: running two different MDSS versions side by side is not supported. A version upgrade
# rolls every service independently, so for upgrades between versions prefer the approaches
# in the README (blue-green, or a clean reinstall), or pass
# `--set deploymentStrategy.rollingUpdate.maxSurge=0 --set deploymentStrategy.rollingUpdate.maxUnavailable=100%`
# so every old pod of a service stops before a new one starts.
# Prefer that over type: Recreate on an existing release: with server-side apply (Helm 4)
# the API server's rollingUpdate defaults cannot be removed, so the upgrade is rejected.
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Available storage providers:
# - minikube-hostpath: Local storage on the current node using the minikube provisioner
# - no-provisioner: WIP, Local storage using static Volumes
# - hostPath
storage_provisioner: hostPath
storage_name: hostPath
storage_node: minikube
hostPathPrefix: mdss-storage-<APP_NAMESPACE>         # This is the absolute path on the node where to keep the database filesystem for persistance, <APP_NAMESPACE> is replaced with the current deployment namespace

# Ingress settings for mdss
mdss_ingress:
  host: <APP_NAMESPACE>-mdss.k8s             # Hostname for the publicly accessible ingress, the `<APP_NAMESPACE>` string will be replaced with the current namespace                
  service: webclient                    # Service name where the ingress should route to, this should be left unchanged          
  port: 80                              # Port where the ingress should route to
  enabled: false                        # Enable or disable the ingress creation      
  class: public                         # Sets the ingress class, it can be "public" or "nginx" or some other value depending on the ingress controller in the cluster
  spec_className: false                 # true -> for adding class as spec || false -> for adding class as annotation. false for GKE as it needs to be as annotation.
  tls: false                            # Flag for set up tls section in ingress
  secret: mdss-tls                      # SecretName of the tls secret created to be used for ingress

# webclient nginx settings
webclient_nginx:
  # DNS server the webclient nginx uses to re-resolve the apigateway Service at request time
  resolver: kube-dns.kube-system.svc.cluster.local
  resolver_valid: 10s                   # How long a resolved address may be reused before it is looked up again
  cluster_domain: cluster.local         # The cluster's DNS domain; the apigateway upstream is <service>.<namespace>.svc.<cluster_domain>

# Auto onboarding settings
auto_onboarding: false                  # If set to true, it will deploy a container that will do the initial setup automatically if correct values are provided
mdss_import_config: null                # Content of config file to be imported by the onboarding container
ONBOARDING_USER_NAME: null              # User name of user that will be created by onboarding container (defaults to admin if left unset)
ONBOARDING_PASSWORD: null               # Password of user that will be created by onboarding container (randomly generated if left unset, can be retrieved from the "onboarding-env" secret)
ONBOARDING_EMAIL: null                  # Email of user that will be created by onboarding container
ONBOARDING_FULL_NAME: null              # Full name of user that will be created by onboarding container

## Uncomment if you want to use a private repo (it must already be configured in the cluster as a secret)
# imagePullSecrets:
#   - name: regcred

# Docker repo to use, this should be changed when using private images (this string will be prepended to the image name)
# If a component has "custom_repo: true" then the image name will be formatted as "{docker_repo/}image_name:{tag}"
# where {tag} comes from the component's `tag:` field (templated; e.g. "{{ .Values.mdplatform_version }}") and
# defaults to `mdss_version` when unset. Components without `custom_repo: true` use their literal `image:` value.
mdss_docker_repo: opswat

imagePullPolicy: IfNotPresent

# Default securityContext applied to all containers. Can be overridden per-component via mdss_components.<name>.securityContext
# To opt a component out of it, set its securityContext to {} (not null: Helm drops null keys, so the default would apply again)
securityContext: {}

mdss_config_map_env_name: 'mdss-env'
mdss_secret_env_name: 'mdss-postgres-cred'
mdssHostAliases:                              # Custom hosts entries
  - ip: "10.0.1.16"
    hostnames:
    - "s3-us-west-1.cloudian-sf"
    - "test.s3-us-west-1.cloudian-sf"
    - "small.s3-us-west-1.cloudian-sf"

mdss_components:
  postgres-mdss:
    name: postgres-mdss
    # Single instance by design: never autoscaled, and never two copies at once
    # (maxSurge 0 stops the old pod before the new one starts, like Recreate)
    hpa:
      enabled: false
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    image: postgres:17
    ports:
      - port: 5432
    persistentDir: /var/lib/postgresql/data 
    is_db: true
    args:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=16GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "temp_buffers=64MB"
      - "-c"
      - "maintenance_work_mem=2GB"
      - "-c"
      - "effective_cache_size=24GB"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "max_replication_slots=0"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=160MB"
    resources:
      requests:
        memory: "12Gi"
        cpu: "1.5"
        ephemeral-storage: "9Gi"

  pgmigrations:
    name: pgmigrations
    # Single instance by design: never autoscaled, and never two copies at once
    # (maxSurge 0 stops the old pod before the new one starts, like Recreate)
    hpa:
      enabled: false
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    custom_repo: true
    image: mdcloudservices_pgmigrations
    ports:
      - port: 27777
    resources:
      requests:
        memory: "0.125Gi"
        cpu: "0.010"
        ephemeral-storage: "2Gi"

  rabbitmq:
    name: rabbitmq
    # Single instance by design: never autoscaled, and never two copies at once
    # (maxSurge 0 stops the old pod before the new one starts, like Recreate)
    hpa:
      enabled: false
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    image: rabbitmq:4.3.5-alpine
    enabled: true
    ports:
      - port: 5672
      - port: 15672
      - port: 15692
    mountConfig:
      configName: rabbitmq-config
      mountPath: /data/rabbitmq/advanced.config
      subPath: advanced.config
    extraVolumeMounts:
      - name: rabbitmq-config
        mountPath: /etc/rabbitmq/conf.d/30-mdss.conf
        subPath: rabbitmq.conf
        readOnly: true
    env:
      - name: RABBITMQ_ADVANCED_CONFIG_FILE
        value: /data/rabbitmq/advanced.config
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "3Gi"
        cpu: "3.0"
        ephemeral-storage: "7Gi"
  
  redis:
    name: redis
    # Single instance by design: never autoscaled, and never two copies at once
    # (maxSurge 0 stops the old pod before the new one starts, like Recreate)
    hpa:
      enabled: false
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    image: redis:8.10.2-alpine
    enabled: true
    ports:
      - port: 6379
    args:
      - "redis-server"
      - "--stop-writes-on-bgsave-error"
      - "no"
      - "--save"
      - ""
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "6Gi"
        cpu: "2.0"
        ephemeral-storage: "7Gi"

  licensingservice:
    name: licensingservice
    custom_repo: true
    image: mdcloudservices_licensing
    tag: "{{ .Values.mdplatform_version }}"
    ports:
      - port: 5000
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "1Gi"
        cpu: "0.8"
        ephemeral-storage: "7Gi"
  
  discoveryservice:
    name: discoveryservice
    # Queues KEDA scales this service on when keda.enabled is true (one trigger per queue)
    keda:
      queues:
        - start_discovery_queue_High
        - start_discovery_queue_Medium
        - start_discovery_queue_Low
        - request_object_download_queue_High
        - request_object_download_queue_Medium
        - request_object_download_queue_Low
        - event_based_discovery_queue_High
        - event_based_discovery_queue_Medium
        - event_based_discovery_queue_Low
        - folder_discovery_queue_High
        - folder_discovery_queue_Medium
        - folder_discovery_queue_Low
    custom_repo: true
    image: mdcloudservices_discovery
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "4Gi"
        cpu: "3.0"
        ephemeral-storage: "7Gi"

  scanningservice:
    name: scanningservice
    # Queues KEDA scales this service on when keda.enabled is true (one trigger per queue)
    keda:
      queues:
        - scanning.object_ready_for_scan.v2_queue_High
        - scanning.object_ready_for_scan.v2_queue_Medium
        - scanning.object_ready_for_scan.v2_queue_Low
        - object_ready_for_scan_queue_High
        - object_ready_for_scan_queue_Medium
        - object_ready_for_scan_queue_Low
        - object_scan_instance_result_queue_High
        - object_scan_instance_result_queue_Medium
        - object_scan_instance_result_queue_Low
    custom_repo: true
    image: mdcloudservices_scanning
    # The MDSS FLAVOUR of the platform scanning image. The bare mdplatform_version tag is
    # the generic, vendor-free base: it ships /app/providers empty on purpose, so a chart
    # deployed against it fails every download with "No in-process storage provider is
    # registered for protocol '<x>'". The "-mdss" suffixed tag is the same image with the
    # provider assemblies layered in.
    tag: "{{ .Values.mdplatform_version }}-mdss"
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "6Gi"
        cpu: "3.0"
        ephemeral-storage: "7Gi"
  
  notificationservice:
    name: notificationservice
    custom_repo: true
    image: mdcloudservices_notification
    tag: "{{ .Values.mdplatform_version }}"
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "0.75Gi"
        cpu: "0.4"
        ephemeral-storage: "7Gi"

  jobdispatcher:
    name: jobdispatcher
    custom_repo: true
    image: mdcloudservices_job-dispatcher
    tag: "{{ .Values.mdplatform_version }}"
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "3Gi"
        cpu: "2.0"
        ephemeral-storage: "7Gi"
  
  loggingservice:
    name: loggingservice
    custom_repo: true
    image: "mdcloudservices_logging"
    tag: "{{ .Values.mdplatform_version }}"
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "3Gi"
        cpu: "1.0"
        ephemeral-storage: "7Gi"

  remediationsservice:
    name: remediationsservice
    # Queues KEDA scales this service on when keda.enabled is true (one trigger per queue)
    keda:
      queues:
        - object_scanned_queue_High
        - object_scanned_queue_Medium
        - object_scanned_queue_Low
        - object_not_scanned_queue_High
        - object_not_scanned_queue_Medium
        - object_not_scanned_queue_Low
    custom_repo: true
    image: mdcloudservices_remediations
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "4Gi"
        cpu: "2.0"
        ephemeral-storage: "7Gi"
  
  storagesservice:
    name: storagesservice
    custom_repo: true
    image: mdcloudservices_storages
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "1.5Gi"
        cpu: "0.5"
        ephemeral-storage: "7Gi"
      
  workflowmanagerservice:
    name: workflowmanagerservice
    custom_repo: true
    image: mdcloudservices_workflowmanager
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "1.5Gi"
        cpu: "1.0"
        ephemeral-storage: "7Gi"
  
  apigateway:
    name: apigateway
    custom_repo: true
    image: mdcloudservices_api
    env:
      # Derived from APIGATEWAY_PORT so Kestrel, the Service and the webclient
      # gate can never disagree about the port. Leaving this as a bare
      # "http://+" would pin Kestrel to 80 no matter what APIGATEWAY_PORT said.
      - name: ASPNETCORE_URLS
        value: 'http://+:{{ (index .Values "mdss-common-environment").APIGATEWAY_PORT }}'
    # This list only gates Service creation. The published ports are taken from
    # mdss-common-environment.APIGATEWAY_PORT / APIGATEWAY_PORT_SSL -- keep the
    # two in step, and change the env vars, not this list, to move a port.
    ports:
      - port: 443
      - port: 80
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "3Gi"
        cpu: "1.5"
        ephemeral-storage: "7Gi"
    sessionAffinity: ClientIP

  webclient:
    name: webclient
    custom_repo: true
    image: mdcloudservices_web
    ports:
      - port: 443
      - port: 80
    mountConfig:
      configName: webclient-nginx-config
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "3Gi"
        cpu: "1.0"
        ephemeral-storage: "7Gi"

  identityservice:
    name: identityservice
    custom_repo: true
    image: mdcloudservices_identityservice
    tag: "{{ .Values.mdplatform_version }}"
    ports:
      - port: 7001
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "1.5Gi"
        cpu: "0.8"
        ephemeral-storage: "7Gi"

# ======================================= MONGOMIGRATIONS MODULE ================================================
  mongodb:
    name: mongodb
    # Single instance by design: never autoscaled, and never two copies at once
    # (maxSurge 0 stops the old pod before the new one starts, like Recreate)
    hpa:
      enabled: false
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    module_name: mongomigrations
    image: mongo:7.0
    ports:
      - port: 27017
    persistentDir: /data/db
    is_db: true
    resources:
      requests:
        memory: "2Gi"
        cpu: "0.5"
        ephemeral-storage: "7Gi"
  
  mongomigrations:
    name: mongomigrations
    # Single instance by design: never autoscaled, and never two copies at once
    # (maxSurge 0 stops the old pod before the new one starts, like Recreate)
    hpa:
      enabled: false
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    module_name: mongomigrations
    custom_repo: true
    image: mdcloudservices_mongo-migrations
    command: ["/bin/sh","-c"]
    args: ['cd /mongomigrations && sh ./migrations.sh 134']
    ports:
      - port: 27778
    resources:
      requests:
        memory: "0.125Gi"
        cpu: "0.010"
        ephemeral-storage: "7Gi"

  # ======================================= SMB MODULE ================================================
  # .NET SMB sidecar, the 4.6.0 default.
  #   image: mdintegrations_smbservice
  #   securityContext: null
  smbservice:
    name: smbservice
    module_name: smb
    custom_repo: true
    image: mdintegrations_smbservice_linux
    tag: "{{ .Values.smb_version }}"
    securityContext:
      capabilities:
        add:
          - SYS_ADMIN
      appArmorProfile:
        type: Unconfined
    ports:
      - port: 5002
    resources:
      requests:
        memory: "0.5Gi"
        cpu: "0.500"
        ephemeral-storage: "7Gi"
  # ======================================= NFS MODULE ================================================
  nfsservice:
    name: nfsservice
    module_name: nfs
    custom_repo: true
    image: mdintegrations_nfsservice
    tag: "{{ .Values.nfs_version }}"
    ports:
      - port: 5004
    extra_labels:
      aws-type: fargate
    resources:
      requests:
        memory: "0.5Gi"
        cpu: "0.500"
        ephemeral-storage: "7Gi"
