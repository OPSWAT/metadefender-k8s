{{/*
Optional OpenShift Route for MDSS.

Routes are the native way to expose a Service outside an OpenShift cluster, so this
is the counterpart to mdss_ingress for OpenShift deployments. It is rendered only
when mdss_route.enabled is true, and `mdss_route` is not part of the chart's default
values, so this template is inert on non-OpenShift clusters and the Route API does
not need to exist. See helm_charts/mdss-openshift.yml for a configured example.

The Route points at webclient, whose nginx serves the web UI and forwards /api to
apigateway, so one Route covers both. Leave mdss_route.host empty to let OpenShift
generate a hostname from the cluster's ingress domain, which is the portable choice.
*/}}
{{- if and .Values.mdss_route .Values.mdss_route.enabled }}
{{- $route := .Values.mdss_route }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ default "mdss-route" $route.name | quote }}
  labels:
    product: mdss
  {{- if $route.annotations }}
  annotations:
    {{- toYaml $route.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if $route.host }}
  host: {{ $route.host | replace "<APP_NAMESPACE>" .Release.Namespace | quote }}
  {{- end }}
  {{- if $route.path }}
  path: {{ $route.path | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ default "webclient" $route.service | quote }}
    weight: 100
  port:
    targetPort: {{ default 80 $route.port }}
  {{- if $route.tls }}
  tls:
    {{- toYaml $route.tls | nindent 4 }}
  {{- end }}
  wildcardPolicy: {{ default "None" $route.wildcardPolicy }}
{{- end }}
