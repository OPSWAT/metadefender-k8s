
# Create a deployment for each component in MDSS
{{ range $component_name, $component := .Values.mdss_components }}
{{- /* apigateway publishes the ports declared in mdss-common-environment
     (APIGATEWAY_PORT / APIGATEWAY_PORT_SSL) so the Service, the containerPort
     and the env the app reads cannot disagree. Keyed on the map key, not
     $component.name, so renaming the component does not bypass it.
     SSL first preserves the original ordering, so the auto-injected
     APIGATEWAY_SERVICE_PORT stays 443. */ -}}
{{- $ports := $component.ports -}}
{{- if eq $component_name "apigateway" -}}
{{-   $env := index $.Values "mdss-common-environment" -}}
{{-   $ports = list (dict "port" (int $env.APIGATEWAY_PORT_SSL)) (dict "port" (int $env.APIGATEWAY_PORT)) -}}
{{- end -}}

{{ if and (not (eq $component.enabled false)) (or $.Values.deploy_with_mdss_db (not $component.is_db)) ( or (not $component.module_name) (contains (print $component.module_name) (index $.Values "mdss-common-environment").ENABLED_MODULES))  }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component.name | quote }}
  labels:
    product: mdss
spec:
  {{- /* Left out when an HPA or KEDA owns the replica count: with server-side apply a
         rendered replicas field (even an empty one) conflicts with the autoscaler on
         every helm upgrade after it has scaled the Deployment. */}}
  {{- if and $component.replicas (not (include "mdss.autoscaling" (dict "component" $component "Values" $.Values))) }}
  replicas: {{ $component.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $component.name | quote }}
  {{- $strategy := $component.strategy | default $.Values.deploymentStrategy }}
  {{- if $strategy }}
  strategy:
    {{- if eq (toString $strategy.type) "Recreate" }}
    {{- /* The API rejects rollingUpdate parameters on a Recreate strategy. The explicit null
           makes helm upgrade delete the defaults the API server filled into a Deployment
           that was created with RollingUpdate; merely omitting the field keeps them. */}}
    type: Recreate
    rollingUpdate: null
    {{- else }}
    {{- toYaml $strategy | nindent 4 }}
    {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ $component.name | quote }}
        product: "mdss"
        {{- if $component.extra_labels }}
          {{- toYaml $component.extra_labels | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: {{ $.Values.mdss_config_map_env_name | quote }}
            - secretRef:
                name: {{ $.Values.mdss_secret_env_name | quote }}
          {{ if $component.custom_repo -}}
          {{- $tag := $.Values.mdss_version -}}
          {{- if $component.tag -}}{{- $tag = tpl $component.tag $ -}}{{- end -}}
          image: {{ printf "%s/%s:%s" $.Values.mdss_docker_repo $component.image $tag | quote }}
          {{- else -}}
          image: {{ $component.image | quote }}
          {{- end }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- $nodeId := $component.custom_repo }}
          {{- range $component.env }}
            {{- if eq .name "MDSS_NODE_ID" }}{{ $nodeId = false }}{{ end }}
          {{- end }}
          {{- if or $component.env $nodeId }}
          env:
            {{- if $nodeId }}
            - name: MDSS_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- with $component.env }}
            {{- /* Rendered through tpl so a value can derive from another
                   value -- apigateway's ASPNETCORE_URLS is built from
                   mdss-common-environment.APIGATEWAY_PORT. Kubernetes' own
                   $(VAR) interpolation cannot do this: it only expands names
                   declared earlier in the same env list, never ones arriving
                   through envFrom, which is how the common environment is
                   mounted. Same mechanism as $component.tag above. */ -}}
                        {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          {{- end }}
          name: {{ $component.name | quote }}
          {{- if $ports }}
          ports:
          {{- range $ports }}
            - containerPort: {{ .port }}
          {{- end }}
          {{- end }}
          {{- if $component.livenessProbe }}
          livenessProbe:
            {{- toYaml $component.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $component.startupProbe }}
          startupProbe:
            {{- toYaml $component.startupProbe | nindent 12 }}
          {{- end }}
          {{- if $component.readinessProbe }}
          readinessProbe:
            {{- toYaml $component.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $component.command }}
          command: 
            {{- toYaml $component.command | nindent 12 }}
          {{- end }}
          {{- if $component.args }}
          args:
            {{- toYaml $component.args | nindent 12 }}
          {{- end }}
          {{- $secCtx := $.Values.securityContext }}
          {{- if hasKey $component "securityContext" }}
            {{- $secCtx = $component.securityContext }}
          {{- end }}
          {{- if $secCtx }}
          securityContext:
            {{- toYaml $secCtx | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: appsettings
              mountPath: /app/appsettings.json
              subPath: appsettings.json
            {{- if $component.mountConfig }}
            - name: {{ $component.mountConfig.configName }}
              mountPath: {{ $component.mountConfig.mountPath }}
              subPath: {{ $component.mountConfig.subPath }}
            {{ end }}
            {{- if (and $component.persistentDir $.Values.persistance_enabled) }}
            - name: {{ $component.name }}
              mountPath: {{ $component.persistentDir }}
              {{- if not (eq $.Values.storage_provisioner "hostPath") }}
              subPath: {{ $component.name }}
              {{- end }}
            {{ end }}
            {{- if $component.extraVolumeMounts }}
              {{- toYaml $component.extraVolumeMounts | nindent 12 }}
            {{- end }}
            {{- $rofs := false }}
            {{- if hasKey $component "securityContext" }}
              {{- if $component.securityContext }}
                {{- $rofs = dig "readOnlyRootFilesystem" false $component.securityContext }}
              {{- end }}
            {{- else if $.Values.securityContext }}
              {{- $rofs = dig "readOnlyRootFilesystem" false $.Values.securityContext }}
            {{- end }}
            {{- if $rofs }}
            - name: tmp
              mountPath: /tmp
            - name: vartmp
              mountPath: /var/tmp
            {{- end }}
          {{- if $component.resources }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          {{- end }}
      {{- if $component.sidecars }}
        {{- toYaml $component.sidecars | nindent 8 }}
      {{- end }}
      {{- if $component.initContainers }}
      initContainers:
        {{- toYaml $component.initContainers | nindent 8 }}
      {{- end }}
          {{- if $component.update_ca }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "update-ca-certificates"]
          {{- end}}
      restartPolicy: Always
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $component.customPodDefinitions }}
        {{- toYaml $component.customPodDefinitions | nindent 6 }}
      {{- end }}
      volumes:
        - name: appsettings
          configMap:
            name: appsettings
        {{- if $component.mountConfig }}
        - name: {{ $component.mountConfig.configName }}
          configMap:
            name: {{ $component.mountConfig.configName }}
        {{ end }}
        {{- if (and $component.persistentDir $.Values.persistance_enabled) }}
        {{- if eq $.Values.storage_provisioner "hostPath" }}
        - name: {{ $component.name }}
          hostPath:
            path: {{ printf "/%s/%s" ( $.Values.hostPathPrefix | replace "<APP_NAMESPACE>" $.Release.Namespace) $component.name }}
            type: DirectoryOrCreate
        {{ else }}
        - name: {{ $component.name }}
          persistentVolumeClaim:
            claimName: {{ printf "%s" $.Values.storage_name }}
            {{ end }}
        {{ end }}
        {{- if $component.extraVolumes -}}
          {{- range $volumeLabel, $volume := $component.extraVolumes }}
        -
            {{- toYaml $volume | nindent 10 }}
        {{- end }}
        {{- end }}
        {{- $rofs := false }}
        {{- if hasKey $component "securityContext" }}
          {{- if $component.securityContext }}
            {{- $rofs = dig "readOnlyRootFilesystem" false $component.securityContext }}
          {{- end }}
        {{- else if $.Values.securityContext }}
          {{- $rofs = dig "readOnlyRootFilesystem" false $.Values.securityContext }}
        {{- end }}
        {{- if $rofs }}
        - name: tmp
          emptyDir: {}
        - name: vartmp
          emptyDir: {}
        {{- end }}
      hostAliases:
        {{- toYaml $.Values.mdssHostAliases | nindent 8 }}
      
{{ end }}
{{ end }}