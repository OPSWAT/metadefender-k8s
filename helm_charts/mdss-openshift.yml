# Run these commands in the namespace you deploy into, before installing the chart:
# oc create sa mdss -n <namespace>
# oc adm policy add-scc-to-user privileged -z mdss -n <namespace>
#
# Components without an explicit securityContext below run under the default restricted SCC,
# i.e. as an arbitrary non-root UID that belongs to the root group. The images support this
# once the two root-only startup steps are switched off (see mdss-common-environment).
# The components that still need root are pinned to UID 0 and use the mdss service account.
# The SMB service (deployed when "smb" is in ENABLED_MODULES) is the one that needs the
# privileged SCC: it mounts shares with the kernel's CIFS client (see smbservice below).

persistance_enabled: false

mdss-common-environment:
  # expose-localhost.sh rewrites /etc/hosts, which needs root; it is a docker-compose
  # leftover that is not needed in a cluster
  EXPOSE_LOCALHOST_ENABLED: "false"
  # Log to stdout only instead of piping through rotatelogs into /var/log/mdss, which is not
  # writable by an arbitrary UID (OpenShift collects container stdout)
  ROTATELOGS_ENABLED: "false"

# OpenShift names its cluster DNS Service dns-default in the openshift-dns namespace
webclient_nginx:
  resolver: dns-default.openshift-dns.svc.cluster.local

mdss_components:
  # initdb must own its data directory, which the upstream image creates for the postgres
  # user (UID 999); an arbitrary UID cannot chmod it. For production use an external database
  # (deploy_with_mdss_db: false) or an OpenShift-ready image such as bitnami/postgresql.
  postgres-mdss:
    securityContext:
      runAsUser: 999
    customPodDefinitions:
      serviceAccountName: mdss
  redis:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  webclient:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  apigateway:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  # The licensing image always pipes its output through rotatelogs into /var/log/mdss
  # (it does not honour ROTATELOGS_ENABLED), so it keeps running as root
  licensingservice:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  # The .NET SMB service (the chart's default image) mounts each share with the kernel's CIFS
  # client. On OpenShift that needs root, CAP_SYS_ADMIN and the SELinux type spc_t: SELinux
  # denies a normal container (container_t) a CIFS mount even as root with CAP_SYS_ADMIN.
  # The privileged SCC on the mdss service account allows all three.
  # It also needs the cifs kernel module on the nodes, a share account allowed to sign in with
  # NTLMv2, and, for NetApp, the address MDSS connects from (each worker's IP, or an EgressIP
  # for the namespace) in the SVM's Vscan scanner pool, for access to the ONTAP_ADMIN$ share.
  smbservice:
    securityContext:
      runAsUser: 0
      capabilities:
        add: [SYS_ADMIN]
      seLinuxOptions:
        type: spc_t
      appArmorProfile: null            # the chart default's AppArmor setting; OpenShift nodes use SELinux
    customPodDefinitions:
      serviceAccountName: mdss
  # On FIPS-enabled clusters the kernel cannot use NTLM, so the .NET SMB service cannot sign in.
  # There, or where the privileged SCC is not allowed, replace the block above with the
  # unprivileged SMB service, which runs under the restricted SCC:
  # smbservice:
  #   image: mdintegrations_smbservice
  #   securityContext: null
  #   extraVolumes:
  #     smb-logs:
  #       name: smb-logs
  #       emptyDir: {}
  #   extraVolumeMounts:
  #     - name: smb-logs
  #       mountPath: /app/logs

# On OpenShift a Route is the native way to expose a Service outside the cluster, so this
# example uses one instead of an Ingress. The chart renders it from
# templates/route-template.yml, which is inert unless mdss_route.enabled is true.
#
# The Route points at webclient, which serves the web UI and forwards /api to apigateway.
# `host` is left empty on purpose: OpenShift then generates a hostname from the cluster's
# own ingress domain (<name>-<namespace>.apps.<cluster-domain>), which keeps this file
# portable across clusters. `<APP_NAMESPACE>` in a fixed host is replaced with the release
# namespace.
#
# TLS terminates at the router with edge termination, and plain HTTP is redirected to
# HTTPS. The router's default certificate is used; to serve your own, add `certificate`
# and `key` under `tls`.
#
# The router closes requests after 30 s by default; webclient's nginx allows 60 s (its
# default proxy_read_timeout), so the Route matches that.
#
# The ONTAP Connector cannot use this Route: its config.ini takes an IPv4 address only,
# and the router picks the backend by hostname. Give it a LoadBalancer or NodePort
# Service in front of webclient instead (MetalLB provides LoadBalancer IPs on-premises).
mdss_route:
  enabled: true
  name: mdss-route
  service: webclient
  port: 80
  host: ""                             # empty -> OpenShift generates the hostname
  annotations:
    haproxy.router.openshift.io/timeout: 60s
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Ingress is disabled: the Route above replaces it.
mdss_ingress:
  enabled: false
