# OpenShift values for the MDSS chart (4.5.2), which deploys one workload per storage
# integration (amazonsdk-services, azureblob-services, ...).
#
# Run these commands in the current project before deploying the chart for priviledged access
# oc create sa mdss
# oc adm policy add-scc-to-user privileged -z mdss -n mdss
#
# Components without an explicit securityContext below run under the default restricted SCC,
# i.e. as an arbitrary non-root UID that belongs to the root group. The components that need a
# specific user are pinned to it and use the mdss service account.

persistance_enabled: false

mdss-common-environment:
  # expose-localhost.sh rewrites /etc/hosts, which needs root; it is a docker-compose
  # leftover that is not needed in a cluster
  EXPOSE_LOCALHOST_ENABLED: "false"
  # Log to stdout only instead of piping through rotatelogs into /var/log/mdss, which is not
  # writable by an arbitrary UID (OpenShift collects container stdout)
  ROTATELOGS_ENABLED: "false"

mdss_components:
  # This chart version mounts persistentDir even when persistance_enabled is false, so it is
  # cleared here. initdb must own its data directory, which the upstream image creates for
  # the postgres user (UID 999). For production use an external database
  # (deploy_with_mdss_db: false) or an OpenShift-ready image such as bitnami/postgresql.
  postgres-mdss:
    persistentDir: null
    securityContext:
      runAsUser: 999
    customPodDefinitions:
      serviceAccountName: mdss
  redis:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  webclient:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  apigateway:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  # The licensing image always pipes its output through rotatelogs into /var/log/mdss
  # (it does not honour ROTATELOGS_ENABLED), so it keeps running as root
  licensingservice:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss

  # MongoDB migration module (only deployed when "mongomigrations" is in ENABLED_MODULES)
  mongodb:
    persistentDir: null
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  mongomigrations:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss

  # Integration workloads (each only deployed when its module is in ENABLED_MODULES).
  # Their supervisord programs always pipe through rotatelogs into /var/log/mdss/services
  # (ROTATELOGS_ENABLED is fixed when the image is built), and that directory belongs to the
  # images' own mdss user, UID 1000, so they run as that user.
  amazonsdk-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  azureblob-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  alibabacloud-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  googlecloud-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  box-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  azurefiles-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  smb-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  graph-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  ftp-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  # The sftp image is built as root: its /var/log/mdss/services belongs to root
  sftp-services:
    securityContext:
      runAsUser: 0
    customPodDefinitions:
      serviceAccountName: mdss
  nfs-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  mft-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
  oraclesdk-services:
    securityContext:
      runAsUser: 1000
    customPodDefinitions:
      serviceAccountName: mdss
