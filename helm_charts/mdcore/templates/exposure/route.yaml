{{- include "mdcore.exposure.validate" . -}}
{{/*
OpenShift Route for MD Core, rendered when exposure.mode=route from the core_route block.
Routes are the native way to expose a Service outside an OpenShift cluster.
See helm_charts/mdcore-openshift.yml for a configured example.

Leave host empty to let OpenShift generate a hostname from the cluster's ingress domain.
*/}}
{{- if eq (include "mdcore.exposure.mode" .) "route" }}
{{- $route := .Values.core_route }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ default "core-route" $route.name | quote }}
  labels:
    product: mdcore
  {{- if $route.annotations }}
  annotations:
    {{- toYaml $route.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if $route.host }}
  host: {{ $route.host | replace "<APP_NAMESPACE>" .Release.Namespace | quote }}
  {{- end }}
  {{- if $route.path }}
  path: {{ $route.path | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ default "md-core" $route.service | quote }}
    weight: 100
  port:
    targetPort: {{ default 8008 $route.port }}
  {{- if $route.tls }}
  tls:
    {{- toYaml $route.tls | nindent 4 }}
  {{- end }}
  wildcardPolicy: {{ default "None" $route.wildcardPolicy }}
{{- end }}
