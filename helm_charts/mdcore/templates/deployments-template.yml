# Create a deployment for each component in MD Core if it's enabled
# (md-core is rendered by statefulset-template.yml instead when statefulset.enabled is true)

{{ range $component_name, $component := .Values.core_components }}
{{ if and (or $.Values.deploy_with_core_db (not $component.is_db)) (not (and $.Values.statefulset.enabled (eq $component.name "md-core"))) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component.name | quote }}
  labels:
    product: mdcore
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels:
      app: {{ $component.name | quote }}
  {{- if $component.strategy}}
  strategy:
    {{- toYaml $component.strategy | nindent 4 }}
  {{- end }}
{{ include "mdcore.podTemplate" (dict "root" $ "component" $component "vct" false) }}
{{ end }}
{{ end }}