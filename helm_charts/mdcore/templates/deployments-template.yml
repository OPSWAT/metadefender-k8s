# Create a deployment for each component in MD Core if it's enabled

{{ range $component_name, $component := .Values.core_components }}
{{ if or $.Values.deploy_with_core_db (not $component.is_db) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component.name | quote }}
  labels:
    product: mdcore
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels:
      app: {{ $component.name | quote }}
  {{- if $component.strategy}}
  strategy:
    {{- toYaml $component.strategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ $component.name | quote }}
        product: mdcore
        {{- if $component.extra_labels }}
          {{- toYaml $component.extra_labels | nindent 8 }}
        {{- end }}
    spec:
      {{- $upgradeDbInit := include "mdss.upgradeDbInitContainerEnabled" (dict "root" $ "component" $component) | trim }}
      {{- $storageVol := dict }}
      {{- if eq $upgradeDbInit "true" }}
      {{- $storageVol = include "mdss.mdCoreStoragePathVolume" (dict "root" $ "component" $component) | fromYaml }}
      {{- end }}
      {{- $autoStorageVolume := and (eq $upgradeDbInit "true") $storageVol.auto }}
      containers:
        - envFrom:
            - configMapRef:
                name: mdcore-env
            {{- if $.Values.env }}
            - configMapRef:
                name: {{ printf "%s-config" $.Release.Name }}
            {{- end }}
          {{ if $component.custom_repo -}}
          image: {{ printf "%s/%s:%s" $.Values.core_docker_repo $component.image $.Values.BRANCH | quote }}
          {{- else -}}
          image: {{ $component.image | quote }}
          {{- end }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- $injectIgnitionJSON := and $.Values.IGNITION_JSON (eq $component.name "md-core") }}
          {{- if or $component.env $injectIgnitionJSON (eq $upgradeDbInit "true") }}
          env:
            {{- if $component.env }}
            {{- toYaml $component.env | nindent 12 }}
            {{- end }}
            {{- if $injectIgnitionJSON }}
            - name: IGNITION_JSON
              valueFrom:
                secretKeyRef:
                  name: mdcore-stack-configs
                  key: IGNITION_JSON
            {{- end }}
            {{- if eq $upgradeDbInit "true" }}
            - name: UPGRADE_DB_SKIP
              value: "true"
            {{- end }}
          {{- end }}
          name: {{ $component.name | quote }}
          {{- if $component.ports }}
          ports:
          {{- range $component.ports }}
            - containerPort: {{ .port }}
          {{- end }}
          {{- end }}
          {{- if $component.livenessProbe }}
          livenessProbe:
            {{- toYaml $component.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $component.startupProbe }}
          startupProbe:
            {{- toYaml $component.startupProbe | nindent 12 }}
          {{- end }}
          {{- if $component.readinessProbe }}
          readinessProbe:
            {{- toYaml $component.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $component.command }}
          command: 
            {{- toYaml $component.command | nindent 12 }}
          {{- end }}
          {{- if $component.args }}
          args:
            {{- toYaml $component.args | nindent 12 }}
          {{- end }}
          {{- if $component.securityContext }}
          securityContext:
            {{- toYaml $component.securityContext | nindent 12 }}
          {{- end }}
          {{- $tls := default dict $component.tls }}
          {{- if (or $component.mountConfig $tls.enabled $component.persistentDir $component.extraVolumeMounts $autoStorageVolume)}}
          volumeMounts:
            {{- if $component.mountConfig }}
            - name: {{ $component.mountConfig.configName }}
              mountPath: {{ $component.mountConfig.mountPath }}
              subPath: {{ $component.mountConfig.subPath }}
            {{ end }}
            {{- if $tls.enabled }}
            - name: {{ $component.tls.certSecret }}
              mountPath: {{ $.Values.MDCORE_CERT_PATH }}/mdcore.crt
              subPath: {{ $component.tls.certSecretSubPath }}
            - name: {{ $component.tls.certKeySecret }}
              mountPath: {{ $.Values.MDCORE_CERT_PATH }}/mdcore.key
              subPath: {{ $component.tls.certKeySecretSubPath }}
            {{ end }}
            {{- if $component.persistentDir }}
            - name: {{ $component.name }}
              mountPath: {{ $component.persistentDir }}
              {{- if not (eq $.Values.storage_provisioner "hostPath") }}
              subPath: {{ $component.name }}
              {{- end }}
            {{ end }}
            {{- if $autoStorageVolume }}
            - name: {{ $storageVol.name }}
              mountPath: {{ $storageVol.mountPath }}
            {{- end }}
            {{- if $component.extraVolumeMounts }}
              {{- toYaml $component.extraVolumeMounts | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $component.resources }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          {{- end }}
          {{- if $component.sidecars }}
            {{- toYaml $component.sidecars | nindent 8 }}
          {{- end }}
      {{- if or $component.initContainers (eq $upgradeDbInit "true") }}
      initContainers:
        {{- if $component.initContainers }}
        {{- toYaml $component.initContainers | nindent 8 }}
        {{- end }}
        {{- if eq $upgradeDbInit "true" }}
        - name: upgrade-db
          {{ if $component.custom_repo -}}
          image: {{ printf "%s/%s:%s" $.Values.core_docker_repo $component.image $.Values.BRANCH | quote }}
          {{- else -}}
          image: {{ $component.image | quote }}
          {{- end }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: mdcore-env
            {{- if $.Values.env }}
            - configMapRef:
                name: {{ printf "%s-config" $.Release.Name }}
            {{- end }}
          env:
            - name: MDCORE_RUN_MODE
              value: "upgrade-only"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mdcore-postgres-cred
                  key: user
            - name: DB_PWD
              valueFrom:
                secretKeyRef:
                  name: mdcore-postgres-cred
                  key: password
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: mdcore-api-key
                  key: value
          {{- if $component.securityContext }}
          securityContext:
            {{- toYaml $component.securityContext | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ $storageVol.name }}
              mountPath: {{ $storageVol.mountPath }}
              {{- if $storageVol.subPath }}
              subPath: {{ $storageVol.subPath }}
              {{- end }}
        {{- end }}
      {{- end }}
      restartPolicy: Always
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $component.customPodDefinitions }}
        {{- toYaml $component.customPodDefinitions | nindent 6 }}
      {{- end }}
      {{- if (or $component.mountConfig $tls.enabled $component.persistentDir $component.extraVolumes $autoStorageVolume )}}
      volumes:
        {{- if $component.mountConfig }}
        - name: {{ $component.mountConfig.configName }}
          configMap:
            name: {{ $component.mountConfig.configName }}
        {{ end }} 
        {{- if $tls.enabled }}
        - name: {{ $component.tls.certSecret }}
          secret:
            secretName: {{ $component.tls.certSecret }}
            defaultMode: 0755
        - name: {{ $component.tls.certKeySecret }}
          secret:
            secretName: {{ $component.tls.certKeySecret }}
            defaultMode: 0755
        {{ end }}
        {{- if $component.persistentDir }}
        {{- if eq $.Values.storage_provisioner "hostPath" }}
        - name: {{ $component.name }}
          hostPath:
            path: {{ printf "/%s/%s" ( $.Values.hostPathPrefix | replace "<APP_NAMESPACE>" $.Release.Namespace) $component.name }}
            type: DirectoryOrCreate
        {{ else }}
        - name: {{ $component.name }}
          persistentVolumeClaim:
            {{- if $component.storage_name }}
            claimName: {{ printf "%s" $component.storage_name }}
            {{ else }}
            claimName: {{ printf "%s" $.Values.storage_name }}
            {{ end }}
        {{ end }}
        {{ end }}
        {{- if $autoStorageVolume }}
        - name: {{ $storageVol.name }}
          emptyDir: {}
        {{- end }}
        {{- if $component.extraVolumes -}}
          {{- range $volumeLabel, $volume := $component.extraVolumes }}
        -
            {{- toYaml $volume | nindent 10 }}
          {{- end }}
        {{- end }}
      {{- end }}
{{ end }}
{{ end }}