
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: mdcore-env
data:
  REST_PORT: {{ .Values.MDCORE_REST_PORT | quote }}
  DB_MODE:   {{ .Values.MDCORE_DB_MODE   | quote }}
  DB_TYPE:   {{ .Values.MDCORE_DB_TYPE   | quote }}
  DB_HOST:   {{ .Values.MDCORE_DB_HOST   | quote }}
  DB_PORT:   {{ .Values.MDCORE_DB_PORT   | quote }}
  ACTIVATION_SERVER: {{ .Values.activation_server }}
  CERT_PATH: {{ .Values.MDCORE_CERT_PATH   | quote }}
  {{- if .Values.STORAGE_PATH }}
  STORAGE_PATH: {{ .Values.STORAGE_PATH | quote }}
  {{- end }}
  {{- if .Values.MD_INSTANCE_SLOTS }}
  MD_INSTANCE_SLOTS: {{ .Values.MD_INSTANCE_SLOTS | quote }}
  MD_INSTANCE_SLOT_PREFIX: {{ .Values.MD_INSTANCE_SLOT_PREFIX | quote }}
  MD_INSTANCE_SLOT_DB: {{ .Values.MD_INSTANCE_SLOT_DB | quote }}
  MD_INSTANCE_SLOT_WAIT_SECONDS: {{ .Values.MD_INSTANCE_SLOT_WAIT_SECONDS | quote }}
  MD_INSTANCE_SLOT_KEEPALIVE_SECONDS: {{ .Values.MD_INSTANCE_SLOT_KEEPALIVE_SECONDS | quote }}
  MD_INSTANCE_SLOT_WATCHDOG_SECONDS: {{ .Values.MD_INSTANCE_SLOT_WATCHDOG_SECONDS | quote }}
  MD_INSTANCE_SLOT_LOST_ACTION: {{ .Values.MD_INSTANCE_SLOT_LOST_ACTION | quote }}
  MD_INSTANCE_SLOT_MAP_ALIAS: {{ .Values.MD_INSTANCE_SLOT_MAP_ALIAS | quote }}
  {{- end }}
---
# add config-map for mdcore-import-zip-config
{{- if and ($.Values.CONFIG_IMPORT_FILE) ($.Values.CONFIG_IMPORT_PASSWORD) }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: mdcore-import-zip-config
data:
  CONFIG_IMPORT_FILE: {{ .Values.CONFIG_IMPORT_FILE | quote }}
  CONFIG_IMPORT_PASSWORD: {{ .Values.CONFIG_IMPORT_PASSWORD | quote }}
{{- end }}

---

{{ if .Values.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" .Release.Name }}
data:
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end}}
{{ end }}

---