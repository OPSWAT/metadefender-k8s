{{- $secretName := include "secrets-map-name" $ -}}

{{/*
Credentials with no safe default: when the corresponding .Values.secrets entry is
left empty, generate one instead of shipping a well-known dev value.

  *_CONNECTION_KEY               4-64 alphanumeric chars
  CONTROL_CENTER_ENCRYPTION_KEY  exactly 32 chars
  ADMIN_APIKEY                   36 hex chars, see "mdcls.apikey"
*/}}
{{- $generated := dict
      "IDENTITY_CONNECTION_KEY"        (randAlphaNum 32)
      "FILE_STORAGE_CONNECTION_KEY"    (randAlphaNum 32)
      "WORKER_CONNECTION_KEY"          (randAlphaNum 32)
      "CONTROL_CENTER_ENCRYPTION_KEY"  (randAlphaNum 32)
      "ADMIN_APIKEY"                   (include "mdcls.apikey" $)
-}}

{{/*
randAlphaNum re-rolls on every render, so a generated key has to be read back out
of the live Secret or `helm upgrade` would rotate it -- and rotating
CONTROL_CENTER_ENCRYPTION_KEY orphans everything Control Center has already
encrypted with the previous one.

`lookup` returns nothing during `helm template` and client-side `--dry-run`, so
those renders always show freshly generated keys; only a real install/upgrade
(or --dry-run=server) sees the values already in the cluster.
*/}}
{{- $live := dict -}}
{{- with (lookup "v1" "Secret" $.Release.Namespace $secretName) -}}
{{- range $k, $v := .data -}}
{{- $_ := set $live $k (b64dec $v) -}}
{{- end -}}
{{- end -}}

{{/* Precedence per key: explicit non-empty value > value already in the cluster > generated. */}}
{{- $secrets := deepCopy (.Values.secrets | default dict) -}}
{{- range $k, $default := $generated -}}
{{- if empty (index $secrets $k) -}}
{{- $_ := set $secrets $k (default $default (index $live $k)) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # Generated credentials cannot be re-derived, so they have to outlive
    # `helm uninstall`: a reinstall into the same namespace adopts this Secret
    # and keeps the keys the existing PostgreSQL data was encrypted with.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{- range $k, $v := $secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
