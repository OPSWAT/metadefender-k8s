{{- $root := . -}}
{{- $name := "file-storage" -}}
{{- $cfg := index .Values $name | default dict -}}
{{- $podSecurityContext := mergeOverwrite (deepCopy ($root.Values.podSecurityContext | default dict)) ($cfg.podSecurityContext | default dict) -}}
{{- $securityContext := mergeOverwrite (deepCopy ($root.Values.securityContext | default dict)) ($cfg.securityContext | default dict) -}}
{{- $readOnlyRootFs := $securityContext.readOnlyRootFilesystem -}}
{{- $svcName := .Values.env.FILE_STORAGE_SERVICE_NAMESPACE | default $name -}}
{{- $persistence := $cfg.persistence | default dict -}}
{{- $probeDefaults := dict
    "startup"   (dict "periodSeconds" 5 "failureThreshold" 60)
    "liveness"  (dict "periodSeconds" 5 "timeoutSeconds" 10 "failureThreshold" 5)
    "readiness" (dict "periodSeconds" 5 "timeoutSeconds" 10 "failureThreshold" 5) -}}
---
# File Storage: StatefulSet + headless Service.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name | quote }}
  labels:
    app: {{ $name | quote }}
    product: {{ include "mdcls.productName" . | quote }}
spec:
  {{- if not (kindIs "invalid" $cfg.replicas) }}
  replicas: {{ $cfg.replicas }}
  {{- end }}
  # Must match the headless Service name (FILE_STORAGE_SERVICE_NAMESPACE).
  serviceName: {{ $svcName | quote }}
  # Treat a pod as available only after it has been ready for 15s.
  minReadySeconds: 15
  selector:
    matchLabels:
      app: {{ $name | quote }}
      product: {{ include "mdcls.productName" . | quote }}
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        product: {{ include "mdcls.productName" . | quote }}
        app: {{ $name | quote }}
    spec:
      # Pod securityContext (incl. fsGroup, which makes the mounted volumes
      # group-writable for the non-root process).
      {{- include "mdcls.securityContext" $podSecurityContext | nindent 6 }}
      {{- if $cfg.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if or $cfg.nodeSelector $cfg.affinity $cfg.tolerations }}
      {{- include "mdcls.scheduling" $cfg | nindent 6 }}
      {{- end }}
      containers:
        - name: {{ $name | quote }}
          image: {{ include "mdcls.image" (dict "root" $root "name" $name "version" $cfg.version) | quote }}
          imagePullPolicy: {{ $cfg.imagePullPolicy | default .Values.imagePullPolicy | quote }}
          {{- include "mdcls.securityContext" $securityContext | nindent 10 }}
          {{- include "mdcls.probes" (dict "defaults" $probeDefaults "overrides" $cfg.probes) | nindent 10 }}
          # data -> /app/storage: file blobs + sqlite metadata (persistent).
          # system -> /app/system: ephemeral writes, only for a read-only root fs.
          volumeMounts:
            - name: data
              mountPath: /app/storage
            {{- if $readOnlyRootFs }}
            - name: system
              mountPath: /app/system
            {{- end }}
          {{- if $cfg.resources }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "config-map-name" $root }}
            - secretRef:
                name: {{ include "secrets-map-name" $root }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if or (not $persistence.enabled) $readOnlyRootFs }}
      volumes:
        {{- if not $persistence.enabled }}
        # Ephemeral blob storage (compose-like) when persistence is disabled.
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if $readOnlyRootFs }}
        # Ephemeral writes for a read-only root filesystem.
        - name: system
          emptyDir: {}
        {{- end }}
      {{- end }}
  {{- if $persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: {{ $name | quote }}
          product: {{ include "mdcls.productName" . | quote }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $persistence.storageClassName }}
        storageClassName: {{ $persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $persistence.size | default "100Gi" }}
  {{- end }}
---
# Headless Service; name is FILE_STORAGE_SERVICE_NAMESPACE.
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName | quote }}
  labels:
    app: {{ $name | quote }}
    product: {{ include "mdcls.productName" . | quote }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: {{ $name | quote }}
  ports:
    - name: file-storage-rest-port
      port: {{ .Values.env.FILE_STORAGE_LISTEN_PORT }}
      targetPort: {{ .Values.env.FILE_STORAGE_LISTEN_PORT }}
