{{- $root := . -}}
{{- $svcName := .Values.env.WORKER_SERVICE_NAMESPACE | default "worker" -}}
{{- $probeDefaults := dict
    "startup"   (dict "periodSeconds" 5 "failureThreshold" 5)
    "liveness"  (dict "periodSeconds" 5 "timeoutSeconds" 10 "failureThreshold" 12)
    "readiness" (dict "periodSeconds" 5 "timeoutSeconds" 10 "failureThreshold" 1) -}}
{{- if .Values.workers }}
---
# Shared headless Service fronting every worker instance.
# Name is WORKER_SERVICE_NAMESPACE (the DNS name workers are addressed under).
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName | quote }}
  labels:
    app: worker
    product: {{ include "mdcls.productName" . | quote }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    component: worker
  ports:
    - name: worker-rest-port
      port: {{ .Values.env.WORKER_LISTEN_PORT }}
{{- end }}
{{- range $wname, $w := .Values.workers }}
{{- $w = $w | default dict -}}
{{- $podSecurityContext := mergeOverwrite (deepCopy ($root.Values.podSecurityContext | default dict)) ($w.podSecurityContext | default dict) -}}
{{- $securityContext := mergeOverwrite (deepCopy ($root.Values.securityContext | default dict)) ($w.securityContext | default dict) -}}
{{- $readOnlyRootFs := $securityContext.readOnlyRootFilesystem -}}
{{- /* The map key is the instance type and selects the image (worker-<type>),
       which bakes in that type's installer plus WORKER_INSTANCE_TYPE and
       WORKER_INSTANCE_VERSION as build-time environment variables. */ -}}
{{- $image := printf "worker-%s" $wname -}}
{{- $svc := $w.service | default dict -}}
{{- $isolate := $w.isolate | default dict -}}
{{- $isoEnabled := true -}}
{{- if hasKey $isolate "enabled" }}{{- $isoEnabled = $isolate.enabled -}}{{- end -}}
{{- $tls := $w.tls | default dict -}}
{{- if and $tls.enabled (ne $wname "api-gateway") }}
{{- fail (printf "workers.%s: tls is only supported for \"api-gateway\", not %q" $wname $wname) }}
{{- end }}
{{- include "mdcls.tlsValidate" (dict "name" (printf "workers.%s" $wname) "tls" $tls) -}}
{{- $tlsMounted := and $tls.enabled $tls.secretName -}}
{{- $env := dict
    "WORKER_INSTANCE_PORT"            $w.listenPort
    "WORKER_INSTANCE_LOG_LEVEL"       ($w.logLevel | default "info")
    "WORKER_ISOLATE_INSTANCE"         $isoEnabled
    "WORKER_ISOLATE_INSTANCE_TIMEOUT" ($isolate.timeout | default 1600) }}
{{- if $tls.enabled }}
{{- $_ := set $env "API_GATEWAY_ENABLE_SSL" true }}
{{- end }}
{{- if $tlsMounted }}
{{- $_ := set $env "API_GATEWAY_CERTIFICATE_PATH" "/run/secrets/api-gateway.crt" }}
{{- $_ := set $env "API_GATEWAY_PRIVATE_KEY_PATH" "/run/secrets/api-gateway.key" }}
{{- end }}
---
# Worker instance "{{ $wname }}" (WORKER_INSTANCE_TYPE={{ $wname }}).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $wname | quote }}
  labels:
    app: {{ $wname | quote }}
    product: {{ include "mdcls.productName" $ | quote }}
spec:
  {{- if not (kindIs "invalid" $w.replicas) }}
  replicas: {{ $w.replicas }}
  {{- end }}
  serviceName: {{ $svcName | quote }}
  selector:
    matchLabels:
      app: {{ $wname | quote }}
      product: {{ include "mdcls.productName" $ | quote }}
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        product: {{ include "mdcls.productName" $ | quote }}
        app: {{ $wname | quote }}
        component: worker
    spec:
      {{- include "mdcls.securityContext" $podSecurityContext | nindent 6 }}
      terminationGracePeriodSeconds: {{ $w.terminationGracePeriodSeconds | default 1800 }}
      {{- if or $w.nodeSelector $w.affinity $w.tolerations }}
      {{- include "mdcls.scheduling" $w | nindent 6 }}
      {{- end }}
      containers:
        - name: {{ $wname | quote }}
          image: {{ include "mdcls.image" (dict "root" $root "name" $image "version" $w.version) | quote }}
          imagePullPolicy: {{ $w.imagePullPolicy | default $.Values.imagePullPolicy | quote }}
          {{- include "mdcls.securityContext" $securityContext | nindent 10 }}
          {{- include "mdcls.probes" (dict "defaults" $probeDefaults "overrides" $w.probes) | nindent 10 }}
          {{- if $w.resources }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          {{- end }}
          {{- if or $readOnlyRootFs $tlsMounted }}
          volumeMounts:
            {{- if $readOnlyRootFs }}
            # Writable mount for a read-only root filesystem: the worker writes
            # everything (config, SLS, logs, deployed instances) under /app/data.
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- if $tlsMounted }}
            {{- include "mdcls.tlsVolumeMounts" (dict "mountBase" "/run/secrets/api-gateway") | nindent 12 }}
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "config-map-name" $root }}
            - secretRef:
                name: {{ include "secrets-map-name" $root }}
          env:
            {{- include "render.env" $env | nindent 12 }}
      {{- if or $readOnlyRootFs $tlsMounted }}
      volumes:
        {{- if $readOnlyRootFs }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if $tlsMounted }}
        {{- include "mdcls.tlsVolumes" $tls | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}

{{- if $w.service }}
{{- if ne $wname "api-gateway" }}
{{- fail (printf "workers.%s: a dedicated service is only supported for \"api-gateway\", not %q" $wname $wname) }}
{{- end }}
---
# Dedicated Service targeting only the {{ $wname }} instance.
apiVersion: v1
kind: Service
metadata:
  name: {{ $wname | quote }}
  labels:
    app: {{ $wname | quote }}
    product: {{ include "mdcls.productName" $ | quote }}
spec:
  {{- if $svc.type }}
  type: {{ $svc.type }}
  {{- end }}
  {{- if $svc.clusterIP }}
  clusterIP: {{ $svc.clusterIP }}
  {{- end }}
  selector:
    app: {{ $wname | quote }}
  ports:
    - name: {{ $wname }}-rest-port
      # port = external access port (default listenPort); targetPort is always
      # the container's listenPort so routing stays correct if they differ.
      port: {{ $svc.port | default $w.listenPort }}
      targetPort: {{ $w.listenPort }}
{{- end }}
{{- end }}
