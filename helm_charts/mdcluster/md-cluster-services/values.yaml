DOCKER_REPO: 'opswat/metadefendercluster-debian'
MDCLS_VERSION: 2.8.0
imagePullPolicy: IfNotPresent
# imagePullSecrets:
#   - name: regcred

# ---------------------------------------------------------------------------
# MD Cluster core services.
#
# Each component below is an intent-level description: replicas, resources,
# scheduling, persistence and a few probe knobs. The structural details of how
# a component is deployed (Deployment vs StatefulSet, rollout strategy, pod
# security context, headless service topology) are fixed in the corresponding
# template under templates/ and are intentionally not exposed here.
#
# Per-component knobs (all optional):
#   version           image tag override, i.e. <name>-<version> (default MDCLS_VERSION)
#   replicas          desired pod count
#   imagePullPolicy   overrides the top-level imagePullPolicy
#   resources         standard k8s resources block (requests/limits)
#   nodeSelector      \
#   affinity           }  standard pod scheduling knobs
#   tolerations       /
#   probes            override timeoutSeconds/failureThreshold per phase
#                     (startup/liveness/readiness); the exec command is fixed
#   terminationGracePeriodSeconds  graceful shutdown window (k8s default if unset)
# ---------------------------------------------------------------------------

# Control Center -> Deployment + NodePort Service
# Singleton: replicas is fixed at 1 by the template.
control-center:
  # version: 2.7.0   # image tag override; defaults to MDCLS_VERSION
  service:
    type: NodePort
    # nodePort: 30001

# Identity Service -> Deployment + ClusterIP Service
# Singleton: replicas is fixed at 1 by the template.
identity-service:
  # version: 2.7.0   # image tag override; defaults to MDCLS_VERSION

# File Storage -> StatefulSet + headless Service
file-storage:
  # version: 2.7.0   # image tag override; defaults to MDCLS_VERSION
  replicas: 1
  # Persist scanned files + sqlite metadata (mounted at /app/storage).
  # enabled false -> emptyDir (ephemeral, like compose).
  persistence:
    enabled: false
    size: 100Gi
    # storageClassName: ""

postgres:
  enabled: true
  image: postgres:16
  pullPolicy: IfNotPresent
  port: 5432
  maxConnections: 200
  # POSTGRES_DB created on first start.
  database: postgres
  # Persist data across restarts. false -> emptyDir (ephemeral, like compose).
  persistence:
    enabled: false
    size: 8Gi
    storageClassName: ""
  resources: {}

redis:
  enabled: true
  image: redis:8
  pullPolicy: IfNotPresent
  port: 6379
  resources: {}

rabbitmq:
  enabled: true
  image: rabbitmq:4.2.5-management
  pullPolicy: IfNotPresent
  amqpPort: 5672
  managementPort: 15672
  resources: {}


secrets:
  CONTROL_CENTER_DB_USER: postgres
  CONTROL_CENTER_DB_PASSWORD: postgres

  IDENTITY_DB_USER: postgres
  IDENTITY_DB_PASSWORD: postgres

  DATALAKE_USER: postgres
  DATALAKE_PASSWORD: postgres

  WAREHOUSE_USER: postgres
  WAREHOUSE_PASSWORD: postgres

  # REDIS_USER: admin # Optional
  # REDIS_PASSWORD: admin # Optional

  RABBITMQ_USER: admin
  RABBITMQ_PASSWORD: admin

  IDENTITY_CONNECTION_KEY: 1234abcd
  CONTROL_CENTER_ENCRYPTION_KEY: ''
  FILE_STORAGE_CONNECTION_KEY: 1234abcd
  WORKER_CONNECTION_KEY: 1234abcd

  ADMIN_USER: admin
  ADMIN_PASSWORD: admin
  ADMIN_EMAIL: admin@admin
  ADMIN_APIKEY: ''

  LICENSE_KEY: ''

# Populates the mdcluster-config ConfigMap that BOTH charts' pods consume.
env:
  CONTROL_CENTER_PORT: 8892
  CONTROL_CENTER_HOST: control-center
  CONTROL_CENTER_LISTEN_PORT: 8892
  # CONTROL_CENTER_LISTEN_HOST: '*' # Not supported yet
  CONTROL_CENTER_DB_HOST: postgres
  CONTROL_CENTER_DB_PORT: 5432

  DATALAKE_SERVICES: postgres:5432
  WAREHOUSE_SERVICES: postgres:5432
  REDIS_SERVICES: redis:6379
  RABBITMQ_SERVICES: rabbitmq:5672

  IDENTITY_DB_HOST: postgres
  IDENTITY_DB_PORT: 5432

  IDENTITY_LISTEN_PORT: 8891
  IDENTITY_LISTEN_HOST: '*'
  IDENTITY_HOST: identity-service
  IDENTITY_PORT: 8891

  FILE_STORAGE_LISTEN_HOST: '*'
  FILE_STORAGE_LISTEN_PORT: 8890
  FILE_STORAGE_SERVICE_NAMESPACE: file-storage
  # min/max file-storage replica setting applied to Control Center after startup.
  # Each falls back to the legacy FILE_STORAGE_REPLICA_COUNT (default 1) when unset.
  FILE_STORAGE_MIN_REPLICA: 1
  FILE_STORAGE_MAX_REPLICA: 1

  WORKER_LISTEN_PORT: 8893
  WORKER_SERVICE_NAMESPACE: worker

  GLOBAL_WAIT_TIMEOUT: 150 # seconds
