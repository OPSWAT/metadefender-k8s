{{- $pg := .Values.postgres -}}
{{- if $pg.enabled }}

{{- if $pg.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  annotations:
    # Keep the PVC (and its data) when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $pg.persistence.size }}
  {{- with $pg.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ $pg.image | quote }}
          imagePullPolicy: {{ $pg.pullPolicy }}
          args: ["-c", "max_connections={{ $pg.maxConnections }}"]
          env:
            # PGDATA in a subdir so the volume root (e.g. lost+found) doesn't clash.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets-map-name" $ }}
                  key: CONTROL_CENTER_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets-map-name" $ }}
                  key: CONTROL_CENTER_DB_PASSWORD
          ports:
            - name: postgres
              containerPort: {{ $pg.port }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if $pg.persistence.enabled }}
          persistentVolumeClaim:
            claimName: postgres
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: {{ $pg.port }}
      targetPort: {{ $pg.port }}
{{- end }}
