{{- $rmq := .Values.rabbitmq -}}
{{- if $rmq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: {{ $rmq.image | quote }}
          imagePullPolicy: {{ $rmq.pullPolicy }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets-map-name" $ }}
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets-map-name" $ }}
                  key: RABBITMQ_PASSWORD
          ports:
            - name: amqp
              containerPort: {{ $rmq.amqpPort }}
            - name: management
              containerPort: {{ $rmq.managementPort }}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml $rmq.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: {{ $rmq.amqpPort }}
      targetPort: {{ $rmq.amqpPort }}
    - name: management
      port: {{ $rmq.managementPort }}
      targetPort: {{ $rmq.managementPort }}
{{- end }}
