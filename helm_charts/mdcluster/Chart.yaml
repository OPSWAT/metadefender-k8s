apiVersion: v2
name: mdcluster
description: MetaDefender Cluster — core services (Control Center, File Storage, Identity Service), worker instances (ometascan, api-gateway, callback-service) and infrastructure (postgres/redis/rabbitmq).

long_description: |
  This chart deploys MetaDefender Cluster
  (https://www.opswat.com/docs/mdcluster). Depending on the provided values it
  can deploy the following:
  - Control Center (singleton Deployment, exposed through a NodePort Service)
  - Identity Service (singleton Deployment, ClusterIP Service)
  - File Storage (StatefulSet behind a headless Service, optionally persistent)
  - One StatefulSet per entry in `workers`, each running the `worker-<type>`
    image matching that entry's key (by default: `ometascan`, `api-gateway`
    and `callback-service`), fronted by a shared headless `worker` Service plus
    an optional dedicated Service for the `api-gateway` instance
  - A PostgreSQL instance pre-configured to be used by MetaDefender Cluster pods
  - A Redis Cache instance pre-configured to be used by MetaDefender Cluster pods
  - A RabbitMQ instance pre-configured to be used by MetaDefender Cluster pods

  Every pod draws its environment from the `mdcluster-config` ConfigMap and
  `mdcluster-secrets` Secret this chart owns, so the core services and the
  workers can never disagree about ports, hostnames or credentials.

  ## Installation

  ### From source
  MetaDefender Cluster can be installed directly from the source code, here's an
  example using generic values:
  ```console
  git clone https://github.com/OPSWAT/metadefender-k8s.git metadefender
  cd metadefender/helm_charts
  helm install mdcluster ./mdcluster
  ```

  ### From the GitHub helm repo
  The installation can also be done using the helm repo which is updated on each release:
  ```console
  helm repo add mdk8s https://opswat.github.io/metadefender-k8s/
  helm repo update mdk8s
  helm install mdcluster mdk8s/mdcluster
  ```

  ## Operational Notes
  The entire deployment can be customized by overwriting the chart's default
  configuration values. The defaults target dev/test parity with the
  docker-compose stack, not production HA. Here are a few points to look out for
  when changing these values:
  - By default, PostgreSQL, Redis and RabbitMQ are deployed alongside the
    MetaDefender Cluster deployment. In a production environment it's
    recommended to use external services instead: set `postgres.enabled`,
    `redis.enabled` and/or `rabbitmq.enabled` to false and point the matching
    `env` entries (`CONTROL_CENTER_DB_HOST`, `IDENTITY_DB_HOST`,
    `DATALAKE_SERVICES`, `WAREHOUSE_SERVICES`, `REDIS_SERVICES`,
    `RABBITMQ_SERVICES`) at the external endpoints
  - Persistence is disabled by default, so the database and scanned files live
    in an emptyDir and are lost when the pod is replaced. Set
    `postgres.persistence.enabled` and `file-storage.persistence.enabled` to
    true for any deployment whose data matters
  - Every credential under `secrets` ships with a development default. Override
    all of them, and set `secrets.LICENSE_KEY`, before exposing the deployment
  - Control Center is published through a NodePort Service by default; change
    `control-center.service.type` (and optionally `nodePort`) to suit the cluster
  - Instance types are defined entirely by the `workers` map. Adding a key
    creates another StatefulSet; removing one deletes it. Each entry requires a
    `listenPort`, and the ports must not collide. The key must be one of
    `ometascan` / `api-gateway` / `callback-service`, since it also selects the
    image (`worker-<key>`) that ships that type's installer
  - Scaling is per instance via `workers.<name>.replicas`; there is no
    autoscaling in this chart
  - Upgrades are driven by the images themselves: each worker uploads its
    baked-in installer on startup and triggers an upgrade to that version, so
    rolling out new worker images is what upgrades the instances
  - Workers shut down gracefully over a long window
    (`terminationGracePeriodSeconds`, default 1800) so in-flight scans can
    finish. Lower it only if you accept losing those scans

type: application
version: 2.9.0
# Mirrors the docker-compose stack; defaults target dev/test parity, not production HA.
# Infrastructure (postgres/redis/rabbitmq) is deployed from the same official
# images as docker-compose via in-chart templates -- no subchart dependencies.
appVersion: "2.9.0"
