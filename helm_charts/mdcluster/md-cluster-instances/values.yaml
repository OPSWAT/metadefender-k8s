DOCKER_REPO: 'opswat/metadefendercluster-debian'
MDCLS_VERSION: 2.8.0
imagePullPolicy: IfNotPresent
# imagePullSecrets:
#   - name: regcred

# Global opt-in to the per-instance pre-upgrade Jobs (each runs the worker
# image as `pre-upgrade`). Only takes effect on `helm upgrade`; enable per
# upgrade with `--set upgradeInstances=true`. A worker may override this with
# its own `upgradeInstances` (see workers below).
upgradeInstances: false

# Workers -> one StatefulSet per entry (instance name -> config), all fronted
# by the shared headless "worker" Service. The map key is the
# WORKER_INSTANCE_TYPE. Per-worker knobs:
#   listenPort        WORKER_INSTANCE_LISTEN_PORT (required)
#   version           image tag override, i.e. worker-<version> (default MDCLS_VERSION)
#   replicas          desired pod count
#   imagePullPolicy   overrides the top-level imagePullPolicy
#   resources         standard k8s resources block (requests/limits)
#   nodeSelector/affinity/tolerations   standard pod scheduling knobs
#   probes            override timeoutSeconds/failureThreshold per phase
#   terminationGracePeriodSeconds        graceful shutdown window (default 1800)
#   logLevel          WORKER_INSTANCE_LOG_LEVEL (default: info)
#   isolate.enabled   WORKER_ISOLATE_INSTANCE (default: true)
#   isolate.timeout   WORKER_ISOLATE_INSTANCE_TIMEOUT (default: 1600)
#   upgradeInstances  run this instance's pre-upgrade Job (default: the
#                     top-level upgradeInstances flag)
#   service           optional dedicated Service {type, clusterIP, port};
#                     port is the external access port (default listenPort),
#                     targetPort is always listenPort. Only supported for
#                     the "api-gateway" instance.
workers:
  ometascan:
    listenPort: 8008
    probes:
      liveness:
        failureThreshold: 90
  api-gateway:
    listenPort: 8899
    service:
      clusterIP: None
  callback-service:
    listenPort: 8894

# Only the keys the worker template reads directly. The full environment comes
# from the mdcluster-config ConfigMap created by md-cluster-services.
env:
  WORKER_LISTEN_PORT: 8893
  WORKER_SERVICE_NAMESPACE: worker
