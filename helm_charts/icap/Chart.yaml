description: |
  This is a Helm chart for deploying MetaDefender ICAP Server (https://www.opswat.com/products/metadefender/icap) in a Kubernetes cluster.

  Release Notes
  - Default MD ICAP Server image bumped to 5.16.1-2 (5.16.1 with fewer image CVEs: Debian packages installed without Recommends, Rocky Kubernetes client on Python 3.12)
  - `cleanup_db` no longer treats running MD ICAP Server instances as inactive: an instance is running while its pod exists, and its partitions and storage are removed only after its pod has been gone for `cleanup_db.range` minutes (default 120)
  - `cleanup_db` keeps the database by default; set `cleanup_db.drop_empty_database: true` to drop it once every instance is cleaned and no session is connected
  - The `cleanup_db` CronJob runs as non-root with the MD ICAP Server service account, and mounts storage only when `cleanup_db.storage.claimName` is set
  - `cleanup_db` mounts its own short-lived service account token (10 minutes), so it also works when the service account sets `automountServiceAccountToken: false`
  - `cleanup_db` handles only this release's database: `db_name` in shared mode, or in standalone mode with `CUSTOMIZE_DB_NAME=true`. `DB_MODE`, `MDICAPSRV_DB_NAME` and `CUSTOMIZE_DB_NAME` set in `icap_components.md_icapsrv.env` (as a value, `configMapKeyRef` or `secretKeyRef`) reach the job too
  - `cleanup_db` skips instances whose pod is shutting down, and installs `psycopg2-binary` only when `cleanup_db.image` does not have `psycopg2` already, so an image with it works without Internet access
long_description: |
  This chart can deploy the following depending on the provided values:
  - One or more MD ICAP Server instances 

  ## Installation
  
  ### From source
  MD ICAP Server can be installed directly from the source code, here's an example using the generic values:
  ```console
  git clone https://github.com/OPSWAT/metadefender-k8s.git metadefender
  cd metadefender/helm_charts
  helm install my_mdicapsrv ./my_mdicapsrv -f my_mdicapsrv-generic-values.yml
  ```

  ### From the latest release
  The installation can also be done using the latest release from github:
  ```console
  helm install my_my_mdicapsrv <MDICAPSRV_RELEASE_URL>.tgz -f my_mdicapsrv-generic-values.yml
  ```

  ## Operational Notes
  The entire deployment can be customized by overwriting the chart's default configuration values. Here are a few point to look out for when changing these values:
  - Sensitive values (like credentials and keys) are saved in the Kubernetes cluster as secrets and are not deleted when the chart is removed and they can be reused for future deployments
  - Credentials that are not explicitly set (passwords and the api key) and do not already exist as k8s secrets will be randomly generated, if they are set, the respective k8s secret will be updated or created if it doesn't exist
  - **The license key value is mandatory**, if it's left unset or if it's invalid, the MD ICAP Server instance will report as "unhealthy" and it will be restarted
  - The configured license should have a sufficient number of activations for all pod running MD ICAP Server, each pod counts as 1 activation. Terminating pods will also deactivate the respective MD ICAP Server instance.
