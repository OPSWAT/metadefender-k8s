---
kind: ConfigMap
apiVersion: v1
metadata:
  name: mdicapsrv-env
  namespace: {{ .Release.Namespace }}
data:
  REST_PORT: {{ .Values.icap_components.md_icapsrv.ports.rest | quote }}
  ICAP_PORT: {{ .Values.icap_components.md_icapsrv.ports.icap | quote }}
  ICAPS_PORT: {{ .Values.icap_components.md_icapsrv.ports.icaps | quote }}
  NGINX_PORT: {{ .Values.icap_components.md_icapsrv.ports.nginx | quote }}
  NGINXS_PORT: {{ .Values.icap_components.md_icapsrv.ports.nginxs | quote }}
  HTTPS_CERT_PATH : {{ .Values.icap_components.md_icapsrv.tls.https.mountPath | quote }}
  ICAPS_CERT_PATH : {{ .Values.icap_components.md_icapsrv.tls.icaps.mountPath | quote }}
  NGINXS_CERT_PATH: {{ .Values.icap_components.md_icapsrv.tls.nginxs.mountPath | quote }}
{{- if .Values.icap_components.md_icapsrv.trustCertificate.enabled }}
  ICAP_TRUST_CERTS_PATH: {{ .Values.icap_components.md_icapsrv.trustCertificate.mountPath | quote }}
{{- end }}
  IMPORT_CONF_FILE : {{ printf "%s/%s" .Values.icap_components.md_icapsrv.import_configuration.importConfigPath  .Values.icap_components.md_icapsrv.import_configuration.importConfigMapSubPath  | quote }}
  ACTIVATION_SERVER: {{ .Values.activation_server }}
  AUDIT_DATA_RETENTION: {{ .Values.icap_components.md_icapsrv.data_retention.config_history | quote}}
  HISTORY_DATA_RETENTION: {{ .Values.icap_components.md_icapsrv.data_retention.processing_history | quote}}
  IMPORT_CONFIG_FILE_PASS: {{ .Values.icap_components.md_icapsrv.import_configuration.importConfigFilePass | quote }}
  DB_MODE: {{ .Values.icap_components.md_icapsrv.database.db_mode | quote }}
  DB_TYPE: {{ .Values.icap_components.md_icapsrv.database.db_type | quote }}
  DB_HOST: {{ .Values.icap_components.md_icapsrv.database.db_host | quote }}
  DB_PORT: {{ .Values.icap_components.md_icapsrv.database.db_port | quote }}
  ACCEPT_EULA: {{ .Values.ACCEPT_EULA | quote }}
  MDICAPSRV_DB_NAME: {{ .Values.db_name | quote }}
{{- if .Values.olms.enabled }}
#Integration OLMS
  OLMS_HOST_URL: {{ .Values.olms.olms_host_url | quote }}
  OLMS_TOKEN: {{ .Values.olms.olms_token | quote }}
  OLMS_REST_PORT: {{ .Values.olms.olms_rest_port | quote }}
  OLMS_SOCKET_PORT: {{ .Values.olms.olms_socket_port | quote }}
  OLMS_RULE: {{ .Values.olms.olms_rule | quote }}
  OLMS_COMMENT: {{ .Values.olms.olms_comment | quote }}
{{- if .Values.olms.olms_use_proxy }}
  OLMS_USE_PROXY: {{ .Values.olms.olms_use_proxy | quote }}
  OLMS_PROXY_SERVER: {{ .Values.olms.olms_proxy_server | quote }}
  OLMS_PROXY_PORT: {{ .Values.olms.olms_proxy_port | quote }}
  OLMS_PROXY_USERNAME: {{ .Values.olms.olms_proxy_username | quote }}
  OLMS_PROXY_PASSWORD: {{ .Values.olms.olms_proxy_password | quote }}
  OLMS_PROXY_PROXY_TYPE: {{ .Values.olms.olms_proxy_type | quote }}
{{- end }}
{{- end }}
{{- if .Values.icap_components.md_icapsrv.nginx_support.enabled }}
{{- $isEnableNginx := .Values.icap_components.md_icapsrv.nginx_support.enabled }}
{{- $nginxPorts := .Values.icap_components.md_icapsrv.ports }}
  ENABLE_NGINX: {{ $isEnableNginx | quote }}
{{- end }}
  ENABLE_HEALTHCHECK: {{ .Values.healthcheck.enabled | quote }}
  LOG_LEVEL: info
  CUSTOM_SECRET: {{ .Values.icap_components.md_icapsrv.custom_secret | quote }}
# Support customize privavte user
  IGNITION_JSON: |
    {"dbserver/private_username":"{{ .Values.mdicapsrv_private_user }}","dbserver/private_password":"{{ .Values.mdicapsrv_private_password }}"}
# Support proxy for ICAP
{{- if .Values.proxy.enabled }}
  http_proxy: "{{ .Values.proxy.http_proxy }}"
  https_proxy: "{{ .Values.proxy.https_proxy }}"
  NO_PROXY: "{{ .Values.proxy.no_proxy }}"
{{- end }}
# Set additional environment variables for the MD ICAP Server container
{{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
# # Uncomment for make ConfigMap for import configuration
---
{{- if .Values.icap_components.md_icapsrv.import_configuration.enabled }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: mdicapsrv-import-configuration
  namespace: {{ .Release.Namespace }}
{{- $file_path := printf "files/%s" .Values.icap_components.md_icapsrv.import_configuration.importConfigMapSubPath}}
{{- $root := . }}
{{- if .Values.icap_components.md_icapsrv.import_configuration.enabled }}
{{- if regexMatch "^.*\\.(zip)$" $file_path }}
binaryData:
  {{ base $file_path }}: {{ $root.Files.Get $file_path | b64enc | quote }}
{{- else if regexMatch "^.*\\.(json)$"  $file_path }}
data:
  {{ base $file_path }}: {{ toJson (.Files.Get $file_path )}}
{{- end }}
{{- end }}
{{- end }}
# Generate, set or keep the MD ICAP Server credentials
{{- $icapPasswordValue := (randAlphaNum 24) | nospace | b64enc | quote }}
{{- $icapUserValue := "admin" | b64enc | quote }}
{{- $icapCredSecret := (lookup "v1" "Secret" .Release.Namespace "mdicapsrv-cred") }}
{{- if $icapCredSecret }}
{{- $icapPasswordValue = index $icapCredSecret.data "password" }}
{{- $icapUserValue = index $icapCredSecret.data "user" }}
{{- end -}}
{{- if .Values.mdicapsrv_password }}
{{- $icapPasswordValue = .Values.mdicapsrv_password | b64enc }}
{{- end -}}
{{- if .Values.mdicapsrv_user }}
{{- $icapUserValue = .Values.mdicapsrv_user | b64enc }}
{{- end }}
---
kind: Secret
apiVersion: v1
metadata:
  name: mdicapsrv-cred
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
data:
  user: {{ $icapUserValue }}
  password: {{ $icapPasswordValue }}


# Generate, set or keep the MD ICAP Server API key
{{- $icapApiKeyValue := (randNumeric 36) | b64enc | quote }}
{{- $icapApiSecret := (lookup "v1" "Secret" .Release.Namespace "mdicapsrv-api-key") }}
{{- if $icapApiSecret }}
{{- $icapApiKeyValue = index $icapApiSecret.data "value" }}
{{- end -}}
{{- if .Values.mdicapsrv_api_key }}
{{- $icapApiKeyValue = .Values.mdicapsrv_api_key | b64enc }}
{{- end }}

---
kind: Secret
apiVersion: v1
metadata:
  name: mdicapsrv-api-key
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
data:
  value: {{ $icapApiKeyValue }}

# Set or keep the MD ICAP Server license key
{{- $icapLicenseKeyValue := "SET_LICENSE_KEY_HERE" | b64enc | quote }}
{{- $icapLicenseSecret := (lookup "v1" "Secret" .Release.Namespace "mdicapsrv-license-key") }}
{{- if $icapLicenseSecret }}
{{- $icapLicenseKeyValue = index $icapLicenseSecret.data "value" }}
{{- end -}}
{{- if .Values.mdicapsrv_license_key }}
{{- $icapLicenseKeyValue = .Values.mdicapsrv_license_key | b64enc }}
{{- end }}

---
kind: Secret
apiVersion: v1
metadata:
  name: mdicapsrv-license-key
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
data:
  value: {{ $icapLicenseKeyValue }}
---
# Generate, set or keep the postgres database credentials
{{- $postgresPasswordValue := (randAlphaNum 24) | nospace | b64enc | quote }}
{{- $postgresUserValue := "postgres" | b64enc | quote }}
{{- $postgresSecret := (lookup "v1" "Secret" .Release.Namespace "mdicapsrv-postgres-cred") }}
{{- if $postgresSecret }}
{{- $postgresPasswordValue = index $postgresSecret.data "password" }}
{{- $postgresUserValue = index $postgresSecret.data "user" }}
{{- end -}}
{{- if .Values.db_password }}
{{- $postgresPasswordValue = .Values.db_password | b64enc }}
{{- end -}}
{{- if .Values.db_user }}
{{- $postgresUserValue = .Values.db_user | b64enc }}
{{- end }}
---
kind: Secret
apiVersion: v1
metadata:
  name: mdicapsrv-postgres-cred
  annotations:
    "helm.sh/resource-policy": keep
data:
  user: {{ $postgresUserValue }}
  password: {{ $postgresPasswordValue }}
---
{{ if .Values.cleanup_db.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-file
data:

  # file-like keys
  main.py: |
    #!/usr/bin/python3
    # MD ICAP Server cleanup_db job: remove the data of instances that no longer run.
    #
    # Only this release's database is handled: MDICAPSRV_DB_NAME in shared mode (DB_MODE 4) and in
    # standalone mode with CUSTOMIZE_DB_NAME=true, otherwise the per-instance
    # metadefender_icapsrv_<instance> databases.
    # An instance is in use while a pod in this namespace runs it (the chart sets
    # MDICAPSRV_INSTANCE_NAME to the pod name). An instance whose pod is gone gets a
    # grace period of `range` minutes, stored in register.instance.status, before its
    # partitions and storage folder are removed. The database itself is dropped only
    # when cleanup_db.drop_empty_database is true, no other session uses it and every
    # instance in it has been cleaned.
    import json
    import os
    import shutil
    import ssl
    import sys
    import time
    import urllib.request
    from contextlib import closing

    import psycopg2
    from psycopg2 import sql
    from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    RANGE_SECONDS = float(os.getenv("range", "120")) * 60


    def log(msg):
        print("[cleanup_db] {}".format(msg), flush=True)


    def env_true(name):
        return os.getenv(name, "false").strip().lower() == "true"


    def connect(dbname):
        return psycopg2.connect(dbname=dbname, user=os.getenv("DB_USER"), password=os.getenv("DB_PWD"),
                                host=os.getenv("DB_HOST"), port=os.getenv("DB_PORT"))


    def live_instance_names():
        """Instance names of the pods in this namespace, and the subset whose pod is being deleted.
        Raises if the API cannot be read."""
        namespace = os.getenv("POD_NAMESPACE") or open(SA_DIR + "/namespace").read().strip()
        token = open(SA_DIR + "/token").read().strip()
        host = os.environ["KUBERNETES_SERVICE_HOST"]
        if ":" in host:
            host = "[{}]".format(host)
        url = "https://{}:{}/api/v1/namespaces/{}/pods".format(host, os.getenv("KUBERNETES_SERVICE_PORT", "443"), namespace)
        opener = urllib.request.build_opener(
            urllib.request.ProxyHandler({}),  # in-cluster API: never go through a proxy
            urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile=SA_DIR + "/ca.crt")))
        request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
        with opener.open(request, timeout=30) as response:
            pods = json.load(response)["items"]

        names, stopping = set(), set()
        for pod in pods:
            if pod.get("status", {}).get("phase") in ("Succeeded", "Failed"):
                continue
            pod_names = {pod["metadata"]["name"]}
            for container in pod["spec"].get("containers", []):
                for env in container.get("env") or []:
                    if env.get("name") == "MDICAPSRV_INSTANCE_NAME" and env.get("value"):
                        pod_names.add(env["value"])  # instance name set explicitly instead of the pod name
            names |= pod_names
            if pod["metadata"].get("deletionTimestamp"):
                stopping |= pod_names
        return names, stopping


    def database_names():
        """The configured database (shared mode, or standalone mode with a customized name).
        Otherwise the automatically named per-instance databases.
        CUSTOMIZE_DB_NAME must be exactly "true", as in entrypoint.sh (setup_dbname)."""
        db_mode = os.getenv("DB_MODE", "4").strip()
        with closing(connect("postgres")) as conn, conn.cursor() as cur:
            if db_mode == "4" or (db_mode == "1" and os.getenv("CUSTOMIZE_DB_NAME") == "true"):
                name = os.getenv("MDICAPSRV_DB_NAME", "").strip() or "metadefender_icapsrv"
                cur.execute("SELECT datname FROM pg_database WHERE datname = %s", (name,))
            else:
                cur.execute(r"SELECT datname FROM pg_database WHERE datname LIKE 'metadefender\_icapsrv\_%'")
            return [row[0] for row in cur.fetchall()]


    def parse_status(text):
        try:
            status = json.loads(text or "{}")
            return status.get("status", "active"), int(status.get("last_active_timestamp") or 0)
        except (ValueError, TypeError, AttributeError):
            return "active", 0


    def set_status(cur, instance_name, state, timestamp):
        cur.execute("UPDATE register.instance SET status = %s WHERE instance_name = %s",
                    (json.dumps({"status": state, "last_active_timestamp": timestamp}), instance_name))


    def drop_partitions(cur, instance_id):
        cur.execute("""SELECT n.nspname, c.relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                       WHERE c.relkind = 'p' ORDER BY 1, 2""")
        for schema, table in cur.fetchall():
            partition = "{}_{}".format(table, instance_id)
            cur.execute(sql.SQL("DROP TABLE IF EXISTS {} CASCADE").format(sql.Identifier(schema, partition)))


    def cleanup_storage(instance_name):
        base = os.getenv("STORAGE_PATH")
        if not env_true("storage_check") or not base:
            return
        base = os.path.realpath(base)
        path = os.path.realpath(os.path.join(base, instance_name))
        if os.path.dirname(path) != base:  # only a direct child of STORAGE_PATH
            log("skip storage cleanup of unexpected path {}".format(path))
            return
        if os.path.isdir(path):
            shutil.rmtree(path)
            log("removed storage folder {}".format(path))


    def other_sessions(dbname):
        with closing(connect("postgres")) as conn, conn.cursor() as cur:
            cur.execute("SELECT count(*) FROM pg_stat_activity WHERE datname = %s AND pid <> pg_backend_pid()", (dbname,))
            return cur.fetchone()[0]


    def drop_database(dbname):
        conn = connect("postgres")
        try:
            conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
            with conn.cursor() as cur:
                cur.execute(sql.SQL("DROP DATABASE IF EXISTS {}").format(sql.Identifier(dbname)))
        finally:
            conn.close()


    def cleanup_database(dbname, live, stopping, now):
        """Returns True when every instance in the database has been cleaned."""
        conn = connect(dbname)
        try:
            with conn.cursor() as cur:
                cur.execute("SELECT instance_id, instance_name, status FROM register.instance ORDER BY instance_id")
                rows = cur.fetchall()
            all_cleaned = True
            for instance_id, instance_name, status_text in rows:
                state, last_active = parse_status(status_text)
                with conn.cursor() as cur:
                    if instance_name in stopping:
                        # Pod is shutting down: keep the time its shutdown hook wrote
                        log("{}: {} is stopping, skip".format(dbname, instance_name))
                        all_cleaned = False
                    elif instance_name in live:
                        log("{}: {} is running, skip".format(dbname, instance_name))
                        all_cleaned = False
                        if state != "active":
                            set_status(cur, instance_name, "active", 0)
                    elif state == "cleaned":
                        pass
                    elif state != "inactive" or last_active <= 0:
                        # Pod is gone but the instance was never marked inactive (crash, SIGKILL,
                        # or the shutdown hook failed): start the grace period now.
                        log("{}: {} has no pod, start the grace period".format(dbname, instance_name))
                        set_status(cur, instance_name, "inactive", now)
                        all_cleaned = False
                    elif now - last_active < RANGE_SECONDS:
                        log("{}: {} inactive for {:.1f} min, grace period {:.0f} min, keep".format(
                            dbname, instance_name, (now - last_active) / 60, RANGE_SECONDS / 60))
                        all_cleaned = False
                    else:
                        if env_true("database_check"):
                            drop_partitions(cur, instance_id)
                        cleanup_storage(instance_name)
                        set_status(cur, instance_name, "cleaned", now)
                        log("{}: cleaned {} (instance_id {})".format(dbname, instance_name, instance_id))
                conn.commit()
            return all_cleaned
        finally:
            conn.close()


    def main():
        if not env_true("enable_check"):
            log("enable_check is not true, nothing to do")
            return 0
        try:
            live, stopping = live_instance_names()
        except Exception as e:  # never guess which instances run
            log("cannot list pods ({}), skip this run".format(e))
            return 1
        log("running instances: {}".format(", ".join(sorted(live)) or "none"))

        try:
            databases = database_names()
        except Exception as e:
            log("cannot list databases ({}), skip this run".format(e))
            return 1
        if not databases:
            log("no MD ICAP Server database found, nothing to do")
            return 0

        now = int(time.time())
        failed = False
        for dbname in databases:
            try:
                if not cleanup_database(dbname, live, stopping, now):
                    continue
                if not env_true("drop_empty_database"):
                    log("{}: every instance is cleaned, keep database (drop_empty_database is false)".format(dbname))
                    continue
                sessions = other_sessions(dbname)
                if sessions > 0:
                    log("{}: keep database, {} other session(s) connected".format(dbname, sessions))
                    continue
                drop_database(dbname)  # PostgreSQL still refuses it if a session connected meanwhile
                log("{}: dropped database, no instance has run for {:.0f} min".format(dbname, RANGE_SECONDS / 60))
            except Exception as e:
                log("{}: cleanup failed: {}".format(dbname, e))
                failed = True
        return 1 if failed else 0


    if __name__ == "__main__":
        sys.exit(main())
{{ end }}